          description: self-describing index, health, feeds and machine discovery documents
        - name: tenders
          description: search, tender sheets and deadlines
        - name: documents
          description: edital markdown and eligibility extraction
        - name: alerts
          description: new-tender alerts by terms/UF or CNPJ family
        - name: watchers
          description: tender change-watchers and their events
        - name: owner
          description: no-signup owner token and webhook secret management
        - name: billing
          description: prepaid credit, x402 payment and delivery receipts
