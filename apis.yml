name: EditalMD
description: Agent-native data API over Brazil's public-procurement portal PNCP (Portal Nacional de Contratações
  Públicas). Provides full-text tender search, proposal and challenge deadlines, editais rendered as markdown with
  provenance and SHA-256 hashes, new-tender alerts by keyword or CNPJ, tender change-watchers, and extracted eligibility
  (habilitação) checklists. Search is free; other routes are paid per request (x402) or via prepaid credit with
  no signup.
