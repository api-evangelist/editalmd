openapi: 3.2.0
info:
  title: EditalMD Consulta API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Consulta
paths:
  /api/consulta/cadastro/{cnpj}:
    get:
      operationId: get_api_consulta_cadastro_by_cnpj
      summary: 'Free registration record: name, status, activity and address'
      description: 'It does not use the free allowance or the balance. It does not reveal contacts or partners and does not run extra analysis. It keeps the protection limit of the origin. For sanctions, tax situation and the live CNIA, request /api/consulta/cnpj/:cnpj explicitly.

        Returns: { consulta, escopo, cnpj, empresa }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ with or without punctuation.
        example: '66300125000145'
      responses:
        '200':
          description: '{ consulta, escopo, cnpj, empresa }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaCadastro'
        '400':
          description: Invalid CNPJ or CEP.
        '404':
          description: Record not found.
        '429':
          description: Protection limit of the origin. Wait for the Retry-After, at no charge.
        '503':
          description: Source unavailable. Try again, at no charge.
      tags:
      - Consulta
  /api/consulta/endereco/{cep}:
    get:
      operationId: get_api_consulta_endereco_by_cep
      summary: Addresses and companies of a CEP, without using the free allowance or the…
      description: 'Up to 20 addresses and 20 companies. pontos_total gives the total; escopo=cadastro. Uses the ConsultaCep shape, without uso or _links. Keeps the protection limit of the origin.

        Returns: { consulta, escopo, cep, endereco, pontos, pontos_total, empresas{itens,mais}, fonte }'
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
        description: CEP with or without a hyphen.
        example: '71915000'
      responses:
        '200':
          description: '{ consulta, escopo, cep, endereco, pontos, pontos_total, empresas{itens,mais}, fonte }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaEndereco'
        '400':
          description: Invalid CNPJ or CEP.
        '404':
          description: Record not found.
        '429':
          description: Protection limit of the origin. Wait for the Retry-After, at no charge.
        '503':
          description: Source unavailable. Try again, at no charge.
      tags:
      - Consulta
  /api/consulta/sugerir:
    get:
      operationId: get_api_consulta_sugerir
      summary: Suggests companies by CNPJ, name, partner, phone or e-mail, without a selector
      description: 'Up to 8 companies, sorted by match. It does not use lookups and does not reveal contacts. incompleto shows that one of the sources did not answer.

        Returns: { ok, incompleto, results }'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Name with 3 to 120 characters, CNPJ, phone with area code or full e-mail.
        example: wrp consultoria
      responses:
        '200':
          description: '{ ok, incompleto, results }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: True when at least one source answered.
                  incompleto:
                    type: boolean
                    description: True when some suggestion source failed.
                  results:
                    type: array
                    items:
                      type: object
                    description: 'Up to 8 companies without repetition: cnpj, label and correspondencia. The text search can include razaoSocial, municipio, bairro, uf, situacao, situacaoEspecial and perto. No contacts or personal names.'
                required:
                - ok
                - incompleto
                - results
        '400':
          description: Incomplete or invalid term.
        '429':
          description: Origin limit.
        '503':
          description: Search unavailable.
      tags:
      - Consulta
  /api/consulta:
    get:
      operationId: get_api_consulta
      summary: 'The CNPJ and address lookup service: today''s free allowance, the single…'
      description: 'Without a credential, it shows the free allowance and the offers. With an account, credit (`X-Credito`) or an x402 wallet (`X-Wallet-Token`), it also shows the balance shared across Radar CNPJ, PontoFato and EditalMD. The wallet credential is issued separately on each portal.

        Returns: { servico, nome, descricao, gratis{por_dia,restantes_hoje,renova_em?}, ofertas[{id,tipo,nome,consultas,dias,renovacao_automatica,preco_usd,preco_brl,disponivel,compra}], lote, saldo{dono,consultas,planos}, como_comprar, _links }'
      parameters:
      - name: lingua
        in: query
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
        description: 'Language of the messages: `pt` or `en` (default: the browser''s language, otherwise English).'
      - name: X-Wallet-Token
        in: header
        required: false
        schema:
          type: string
        description: mmw_… credential of this portal, obtained through the wallet signature at /api/auth/wallet/agent/start and /api/auth/wallet/agent/token. It authorizes the use of the x402 wallet balance.
      responses:
        '200':
          description: '{ servico, nome, descricao, gratis{por_dia,restantes_hoje,renova_em?}, ofertas[{id,tipo,nome,consultas,dias,renovacao_automatica,preco_usd,preco_brl,disponivel,compra}], lote, saldo{dono,consultas,planos}, como_comprar, _links }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaServico'
        '401':
          description: Credencial apresentada e recusada.
        '503':
          description: Account or balance service down.
      tags:
      - Consulta
  /api/consulta/cnpj/{cnpj}:
    get:
      operationId: get_api_consulta_cnpj_by_cnpj
      summary: 'Looks up a company by CNPJ: the Federal Revenue record, the company''s sanctions…'
      description: 'One lookup uses the free daily allowance (10 per account, or per network without an account), then the account or credit balance. Without allowance or balance, HTTP 402 includes offers. Numeric and alphanumeric CNPJs are accepted. Missing records, unavailable sources and rate limits are not charged. Personal data stays masked. The sancoes block lists public records against the whole company: CEIS, CNEP, CEPIM, CGU leniency agreements and TCU debarred bidders. Check source dates before supplier decisions.

        Returns: { consulta, temas?, cnpj, empresa, sancoes?{total,vigentes,porCadastro,itens,mais,conferidoEm,cadastros}, cnia?{situacao,registros,conferidoEm,cnpjs,link}, dividaAtiva?{inscricoes,valor,valorCorresponsavel,ajuizadas,maisAntiga,porNatureza,porSituacao,maiores,mais,referencia,conferidoEm,fonte}, parcelamentos?{quantidade,saldo,itens,referencia,conferidoEm,fonte}, regimeTributario?{atual,anos,referencia,conferidoEm,fonte}, beneficiosFiscais?{itens,mais,importacao,referencia,conferidoEm,fonte}, obras?{quantidade,ativas,anteriores,destinacoes,itens,mais,referencia,conferidoEm,fonte}, devedorContumaz?{consta,itens,lista,referencia,conferidoEm,fonte}, ambiental?{autos,embargos}, trabalhoEscravo?{consta,itens,referencia,conferidoEm,fonte}, governo?{quantidade,valor,ultimos12Meses,orgaos,itens,mais,referencia,conferidoEm,fonte}, pagamentos?{valor,quantidade,desde,ultimo,orgaos,referencia,fonte}, notasFederais?{valor,notas,desde,ate,compradores,anos,referencia,fonte}, contratosFederais?{quantidade,valor,desde,orgaos,itens,mais,referencia,fonte}, campanhas?{quantidade,valor,anos,partidos,itens,mais,referencia,fonte}, municipiosSp?{pago,empenhado,municipios,desde,anos,orgaos,elementos,modalidades,referencia,fonte}, pep?{quantidade,pessoas,referencia,conferidoEm,fonte}, registros?{itens,fontes}, bndes?{contratos,ativos,valorContratado,valorDesembolsado,itens,mais,referencia,fonte}, fundos?{proprio,fundos,patrimonio,papeis,itens,mais,referencia,fonte}, ponto?{lat,lon,precisao,logradouro,numero,bairro,cidade,uf,cep,fonte}, uso{via,restantes}, _links }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ with or without punctuation (14 characters).
        example: 00000000000191
      - name: lingua
        in: query
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
        description: 'Language of the messages: `pt` or `en` (default: the browser''s language, otherwise English).'
      - name: temas
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated topics (up to 240 characters): dados, socios, sancoes, fiscal, divida, obras, trabalho, ibama, contratos, pep, vendas, campanhas, prefeituras, sicaf, aeronaves, fundos, rntrc, bndes, registros; todos. Omit for the full record. Basic company data always stays; partners require socios. Unrequested fields are omitted; null means an unchecked source. SICAF, aircraft and RNTRC select registry agencies; registros includes all agencies. Prices, limits and personal data masking do not change.'
        example: sicaf,contratos,bndes
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Attempt key (up to 80 characters): repeating the SAME lookup with the same key does not charge the balance twice.'
      - name: X-Wallet-Token
        in: header
        required: false
        schema:
          type: string
        description: mmw_… credential of this portal, obtained through the wallet signature at /api/auth/wallet/agent/start and /api/auth/wallet/agent/token. It authorizes the use of the x402 wallet balance.
      responses:
        '200':
          description: '{ consulta, temas?, cnpj, empresa, sancoes?{total,vigentes,porCadastro,itens,mais,conferidoEm,cadastros}, cnia?{situacao,registros,conferidoEm,cnpjs,link}, dividaAtiva?{inscricoes,valor,valorCorresponsavel,ajuizadas,maisAntiga,porNatureza,porSituacao,maiores,mais,referencia,conferidoEm,fonte}, parcelamentos?{quantidade,saldo,itens,referencia,conferidoEm,fonte}, regimeTributario?{atual,anos,referencia,conferidoEm,fonte}, beneficiosFiscais?{itens,mais,importacao,referencia,conferidoEm,fonte}, obras?{quantidade,ativas,anteriores,destinacoes,itens,mais,referencia,conferidoEm,fonte}, devedorContumaz?{consta,itens,lista,referencia,conferidoEm,fonte}, ambiental?{autos,embargos}, trabalhoEscravo?{consta,itens,referencia,conferidoEm,fonte}, governo?{quantidade,valor,ultimos12Meses,orgaos,itens,mais,referencia,conferidoEm,fonte}, pagamentos?{valor,quantidade,desde,ultimo,orgaos,referencia,fonte}, notasFederais?{valor,notas,desde,ate,compradores,anos,referencia,fonte}, contratosFederais?{quantidade,valor,desde,orgaos,itens,mais,referencia,fonte}, campanhas?{quantidade,valor,anos,partidos,itens,mais,referencia,fonte}, municipiosSp?{pago,empenhado,municipios,desde,anos,orgaos,elementos,modalidades,referencia,fonte}, pep?{quantidade,pessoas,referencia,conferidoEm,fonte}, registros?{itens,fontes}, bndes?{contratos,ativos,valorContratado,valorDesembolsado,itens,mais,referencia,fonte}, fundos?{proprio,fundos,patrimonio,papeis,itens,mais,referencia,fonte}, ponto?{lat,lon,precisao,logradouro,numero,bairro,cidade,uf,cep,fonte}, uso{via,restantes}, _links }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaCnpj'
        '400':
          description: Invalid CNPJ or temas_invalidos (nothing is charged).
        '401':
          description: 'Credential presented and refused: session ended or invalid API key.'
        '402':
          description: 'The free daily allowance and the balance are used up: `error` (`franquia_esgotada` or `saldo_esgotado`), `message`, `gratis` (with `renova_em`) and `ofertas[]` with the purchase URL, in the shape of `GET /api/consulta`. On the portal that sells the single call, also `accepts` (x402) and `por_chamada` (`preco_usd`, `como`): repeat the call with the x402 proof or with `Authorization: Bearer cred_…`, without an account or package; only what the origin delivered is charged.'
        '404':
          description: Not in the base (the lookup is not charged).
        '429':
          description: Too many lookups in this minute; obey the Retry-After (the lookup is not charged).
        '503':
          description: Data source or balance service down (the lookup is not charged).
      tags:
      - Consulta
  /api/consulta/cep/{cep}:
    get:
      operationId: get_api_consulta_cep_by_cep
      summary: 'Looks up an address by CEP: the addresses with coordinates (CNEFE/IBGE) and the…'
      description: 'One lookup, paid like the CNPJ lookup: the free daily allowance, then the balance. It returns up to 20 addresses and up to 20 companies; the total of addresses comes in `pontos_total`.

        Returns: { consulta, cep, endereco, pontos, pontos_total, empresas{itens,mais}, fonte, uso{via,restantes}, _links }'
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
        description: CEP with 8 digits, with or without a hyphen.
        example: '01310100'
      - name: lingua
        in: query
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
        description: 'Language of the messages: `pt` or `en` (default: the browser''s language, otherwise English).'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Attempt key (up to 80 characters): repeating the SAME lookup with the same key does not charge the balance twice.'
      - name: X-Wallet-Token
        in: header
        required: false
        schema:
          type: string
        description: mmw_… credential of this portal, obtained through the wallet signature at /api/auth/wallet/agent/start and /api/auth/wallet/agent/token. It authorizes the use of the x402 wallet balance.
      responses:
        '200':
          description: '{ consulta, cep, endereco, pontos, pontos_total, empresas{itens,mais}, fonte, uso{via,restantes}, _links }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaCep'
        '400':
          description: Invalid CNPJ or CEP (nothing is charged).
        '401':
          description: 'Credential presented and refused: session ended or invalid API key.'
        '402':
          description: 'The free daily allowance and the balance are used up: `error` (`franquia_esgotada` or `saldo_esgotado`), `message`, `gratis` (with `renova_em`) and `ofertas[]` with the purchase URL, in the shape of `GET /api/consulta`. On the portal that sells the single call, also `accepts` (x402) and `por_chamada` (`preco_usd`, `como`): repeat the call with the x402 proof or with `Authorization: Bearer cred_…`, without an account or package; only what the origin delivered is charged.'
        '404':
          description: Not in the base (the lookup is not charged).
        '429':
          description: Too many lookups in this minute; obey the Retry-After (the lookup is not charged).
        '503':
          description: Data source or balance service down (the lookup is not charged).
      tags:
      - Consulta
  /api/consulta/planos/{oferta}:
    post:
      operationId: post_api_consulta_planos_by_oferta
      summary: Buys the single package or one of the three plans, with credit or x402, also…
      description: 'Without payment, it returns 402 with the price in dollars and reais. The body uses x402 v1; PAYMENT-REQUIRED uses v2. With an account or credit, the balance stays with that holder. Without identification, it stays with the wallet that the x402 payment confirmed. To use this balance, sign the wallet challenge and get the mmw_… credential at the wallet_start and wallet_token URLs of the answer. The payment does not grant a login or access to the linked account. A plan adds 30 days and the quota; a package is valid for 90 days. No automatic renewal.

        Returns: { comprado, nome, consultas, valido_ate, saldo, via, cobranca, recibo, message, _links }'
      parameters:
      - name: oferta
        in: path
        required: true
        schema:
          type: string
        description: 'The offer: `pacote`, `basico`, `profissional` or `empresa`.'
        example: basico
      - name: lingua
        in: query
        required: false
        schema:
          type: string
          enum:
          - pt
          - en
        description: 'Language of the messages: `pt` or `en` (default: the browser''s language, otherwise English).'
      - name: compra
        in: query
        required: false
        schema:
          type: string
        description: 'Mark of this purchase (8 to 64 characters `A-Za-z0-9_-`): with credit, repeating with the same mark does not charge again. With x402, do not sign another payment to repeat the same purchase.'
      - name: X-Credito
        in: header
        required: false
        schema:
          type: string
        description: Prepaid credit token (`cred_…`) that pays for the purchase.
      - name: X-Api-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Account API key (`mmk_…`): the plan stays with the account.'
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
        description: Signed x402 payment, from the 402 quote.
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema:
          type: string
        description: x402 v2 payment. Use only one payment header.
      - name: X-Wallet-Token
        in: header
        required: false
        schema:
          type: string
        description: mmw_… credential of this portal, obtained through the wallet signature at /api/auth/wallet/agent/start and /api/auth/wallet/agent/token. It authorizes the use of the x402 wallet balance.
      responses:
        '200':
          description: '{ comprado, nome, consultas, valido_ate, saldo, via, cobranca, recibo, message, _links }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaCompra'
        '400':
          description: Malformed payment, unknown version, or an offer different from the quoted one.
        '401':
          description: Credential presented and refused. Without a credential, the purchase continues through x402.
        '402':
          description: 'Payment required: the price, the credit and x402.'
        '404':
          description: Oferta desconhecida.
        '409':
          description: 'Billing is off for this offer: nothing was charged or created.'
        '503':
          description: Offer without a configured price, or payment is down.
      tags:
      - Consulta
components:
  schemas:
    ConsultaGoverno:
      type: object
      properties:
        quantidade:
          type: integer
          description: How many contracts the company has in PNCP.
        valor:
          type: number
          description: The sum of their total value, in reais.
        ultimos12Meses:
          type: object
          description: '`{ quantidade, valor }` of the contracts signed in the last 12 months.'
        orgaos:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaOrgaoContratante'
          description: The five agencies that contracted the most, by value.
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaContratoPublico'
          description: The ten newest contracts, by signing date.
        mais:
          type: integer
          description: How many contracts were left out of `itens`.
        referencia:
          type: string
          description: The last PNCP day that entered the base (`YYYY-MM-DD`).
          nullable: true
        conferidoEm:
          type: string
          description: The day the database was checked.
          nullable: true
        fonte:
          type: string
          description: A fonte oficial.
      required:
      - quantidade
      - valor
      - ultimos12Meses
      - orgaos
      - itens
      - mais
      - referencia
      - conferidoEm
      - fonte
      description: The government contracts of the whole company in the PNCP (federal, state and municipal, since 2021).
    ConsultaSaldo:
      type: object
      properties:
        dono:
          type: string
          description: '`conta` (session or API key), `carteira` (credit) or `x402`.'
        consultas:
          type: integer
          description: Remaining lookups, added up.
        planos:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaPlanoAtivo'
          description: The active purchases, the one that expires first at the top.
      required:
      - dono
      - consultas
      - planos
      description: The requester's balance, added up across the plans and packages in force, valid on all portals.
    ConsultaDevedorContumaz:
      type: object
      properties:
        consta:
          type: boolean
          description: '`true` when the company (the CNPJ root) is on the list.'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaContumaz'
          description: The company's CNPJs on the list; empty when it is not on it.
        lista:
          type: string
          description: The list page at the Federal Revenue.
        referencia:
          type: string
          description: 'The source snapshot: the month that closes the PGFN quarter (`2026-06`) or the day of publication at the Federal Revenue.'
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database (`AAAA-MM-DD`).
        fonte:
          type: string
          description: Who publishes the data set.
      required:
      - consta
      - itens
      - lista
      - referencia
      - conferidoEm
      - fonte
      description: 'The Federal Revenue chronic tax debtor list (Complementary Law 225/2026): a company on it is barred from public tenders, among other restrictions.'
    ConsultaUso:
      type: object
      properties:
        via:
          type: string
          description: '`gratis` (daily allowance) or `saldo` (plan or package).'
        restantes:
          type: integer
          description: How many are left on the same route after this one.
          nullable: true
      required:
      - via
      - restantes
      description: Who paid for this lookup.
    ConsultaFundo:
      type: object
      properties:
        papel:
          type: string
          description: '`fundo` or `classe` (itself); `administrador`, `gestor`, `auditor`, `custodiante` or `controlador` (the role of the company).'
        cnpj:
          type: string
          description: The CNPJ of the fund or of the class.
        nome:
          type: string
          description: The corporate name.
          nullable: true
        tipo:
          type: string
          description: '`FI`, `FII`, `FIDC`, `FIP`, `Classes de Cotas de Fundos FII`…'
          nullable: true
        situacao:
          type: string
          description: '`Em Funcionamento Normal`, `Fase Pré-Operacional`, `Em Liquidação`, `Cancelado`.'
          nullable: true
        patrimonio:
          type: number
          description: The net assets, in reais (an impossible value, above R$ 1 trillion, comes as null).
          nullable: true
        patrimonioEm:
          type: string
          description: The day of the net assets (`YYYY-MM-DD`).
          nullable: true
        registro:
          type: string
          description: The CVM registration (`AAAA-MM-DD`).
          nullable: true
        detalhe:
          type: string
          description: 'In the fund itself: who administers, manages, audits and holds custody.'
          nullable: true
      required:
      - papel
      - cnpj
      - nome
      - tipo
      - situacao
      - patrimonio
      - patrimonioEm
      - registro
      - detalhe
      description: An investment fund or a fund class in the CVM register (Resolution 175).
    ConsultaBndes:
      type: object
      properties:
        contratos:
          type: integer
          description: How many contracts (subcredits count once); `0` when none.
        ativos:
          type: integer
          description: How many active contracts.
        valorContratado:
          type: number
          description: The contracted total, in reais.
        valorDesembolsado:
          type: number
          description: The disbursed total, in reais.
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaOperacaoBndes'
          description: The ten newest operations.
        mais:
          type: integer
          description: How many operations were left out of `itens`.
        referencia:
          type: string
          description: The day of the BNDES publication (`YYYY-MM-DD`).
          nullable: true
        fonte:
          type: string
          description: A fonte oficial.
      required:
      - contratos
      - ativos
      - valorContratado
      - valorDesembolsado
      - itens
      - mais
      - referencia
      - fonte
      description: The non-automatic BNDES financings of the whole company (the automatic operation does not identify the client).
    ConsultaPonto:
      type: object
      properties:
        lat:
          type: number
          description: Latitude WGS84.
        lon:
          type: number
          description: Longitude WGS84.
        precisao:
          type: string
