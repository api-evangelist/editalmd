      - uf
      - municipio
      - categoria
      - tipo
      - objeto
      - valor
      - assinatura
      - vigenciaFim
      - cnpj
      - link
      description: A contract published in the PNCP (Law 14.133) in which the company is the supplier.
    ConsultaRegistros:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaRegistro'
          description: The registrations, in the order CVM, Banco Central, ANS, ANTT, ANP, ANEEL, Anatel, Anvisa, CNES, Cadastur, Ibama, ANAC and SICAF.
        fontes:
          type: array
          items:
            type: object
          description: 'The agencies checked: `{ orgao, quantidade, referencia, conferidoEm, fonte }`, with how many records each one has.'
      required:
      - itens
      - fontes
      description: The records of the whole company at regulatory agencies, up to 20 per agency.
    ConsultaObras:
      type: object
      properties:
        quantidade:
          type: integer
          description: How many construction works the company has in the CNO (including the ones with an ended link).
        ativas:
          type: integer
          description: How many are active and still with it.
        anteriores:
          type: integer
          description: In how many it was responsible before (the link has ended).
        destinacoes:
          type: array
          items:
            type: object
          description: 'The main intended uses: `{ destinacao, quantidade }`, up to 5.'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaObra'
          description: 'Up to 20: the ones in progress first, then the active ones, the newest first.'
        mais:
          type: integer
          description: How many construction works were left out of the list.
        referencia:
          type: string
          description: 'The source snapshot: the month that closes the PGFN quarter (`2026-06`) or the day of publication at the Federal Revenue.'
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database (`AAAA-MM-DD`).
        fonte:
          type: string
          description: Who publishes the data set.
      required:
      - quantidade
      - ativas
      - anteriores
      - destinacoes
      - itens
      - mais
      - referencia
      - conferidoEm
      - fonte
      description: The construction works for which the company is or was responsible, in the monthly CNO snapshot.
    ConsultaPep:
      type: object
      properties:
        quantidade:
          type: integer
          description: How many partners are on the list; `0` when none.
        pessoas:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaPessoaPep'
          description: The partners on the list, with their offices.
        referencia:
          type: string
          description: The month of the CGU list (`YYYY-MM`).
          nullable: true
        conferidoEm:
          type: string
          description: The day the list entered the database.
          nullable: true
        fonte:
          type: string
          description: A fonte oficial.
      required:
      - quantidade
      - pessoas
      - referencia
      - conferidoEm
      - fonte
      description: The company's partners on the CGU list of politically exposed persons, matched by the six CPF digits and by the name.
    ConsultaBeneficio:
      type: object
      properties:
        fonte:
          type: string
          description: '`sisen`, `ecf`, `dirbi` or `importacao`.'
        beneficio:
          type: string
          description: The name of the benefit (in the DIRBI, the one of IN RFB no. 2.198/2024).
        ano:
          type: integer
          description: 'ECF, DIRBI and import: the calendar year.'
          nullable: true
        tributo:
          type: string
          description: 'Import and DIRBI: the taxes of the benefit in the year (`Imposto de Importação`, `COFINS, PIS`, `CSLL, IRPJ`…).'
          nullable: true
        ultimoMes:
          type: string
          description: 'DIRBI: the last month declared in the year (`YYYY-MM`), from the monthly DIRBI.'
          nullable: true
        inicio:
          type: string
          description: 'SISEN: the start of the benefit period.'
          nullable: true
        fim:
          type: string
          description: 'SISEN: the end of the benefit period (empty: in force).'
          nullable: true
        vigente:
          type: boolean
          description: 'SISEN: whether the benefit is in force today.'
          nullable: true
        valor:
          type: number
          description: 'ECF, DIRBI and import: the tax relief amount in the year, in reais.'
          nullable: true
        cnpj:
          type: string
          description: The qualified or declaring CNPJ (for imports, empty when the benefit groups establishments).
          nullable: true
        vezes:
          type: integer
          description: How many times the same record appears in the source, joined in one line (in the SISEN, the RET appears once per development).
      required:
      - fonte
      - beneficio
      - ano
      - tributo
      - ultimoMes
      - inicio
      - fim
      - vigente
      - valor
      - cnpj
      - vezes
      description: 'A tax benefit: the qualification in a special regime (SISEN), an IRPJ/CSLL waiver in the ECF, a waiver declared in the DIRBI or an import waiver (Transparency Portal).'
    ConsultaPessoaPep:
      type: object
      properties:
        nome:
          type: string
          description: The partner's name, abbreviated as in the partner list of the record (`MARIA F. S.`).
        qualificacao:
          type: string
          description: The role in the partner list (`Sócio-Administrador`…).
          nullable: true
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaCargoPep'
          description: The offices that make the person a PEP, the current ones first.
      required:
      - nome
      - qualificacao
      - cargos
      description: A partner of the company who is on the list of politically exposed persons.
    ConsultaSancao:
      type: object
      properties:
        cadastro:
          type: string
          description: '`ceis`, `cnep`, `cepim`, `leniencia` (CGU) or `tcu` (debarred bidders).'
        id:
          type: string
          description: 'Identifier in the register: code of the sanction, grant agreement, agreement or case#ruling.'
        cnpj:
          type: string
          description: The CNPJ under which it was registered (it can be another establishment of the same company).
        sancionado:
          type: string
          description: The name in the register.
          nullable: true
        tipo:
          type: string
          description: Category of the sanction, reason for the debarment or, for leniency, the status of the agreement.
          nullable: true
        orgao:
          type: string
          description: Sanctioning or granting agency.
          nullable: true
        ufOrgao:
          type: string
          description: State (UF) of the agency.
          nullable: true
        esfera:
          type: string
          description: '`FEDERAL`, `ESTADUAL` or `MUNICIPAL`.'
          nullable: true
        inicio:
          type: string
          description: Start (YYYY-MM-DD).
          nullable: true
        fim:
          type: string
          description: End (YYYY-MM-DD); `null` when the register does not state it.
          nullable: true
        vigente:
          type: boolean
          description: '`true` without an end date, or with the end from today on (Brasília time).'
        publicacao:
          type: string
          description: Publication or date of the information (YYYY-MM-DD).
          nullable: true
        processo:
          type: string
          description: Case number.
          nullable: true
        valorMulta:
          type: number
          description: Fine in reais (CNEP).
          nullable: true
        fundamentacao:
          type: string
          description: Legal basis or terms of the agreement, up to 600 characters.
          nullable: true
        link:
          type: string
          description: The case on the TCU website, when the register is the TCU.
          nullable: true
      required:
      - cadastro
      - id
      - cnpj
      - sancionado
      - tipo
      - orgao
      - ufOrgao
      - esfera
      - inicio
      - fim
      - vigente
      - publicacao
      - processo
      - valorMulta
      - fundamentacao
      - link
      description: A record of the company in a public sanctions register.
    ConsultaDividaAtiva:
      type: object
      properties:
        inscricoes:
          type: integer
          description: Debt entries in which the company appears (as debtor or co-responsible party).
        valor:
          type: number
          description: Total owed as the main debtor, in reais.
        valorCorresponsavel:
          type: number
          description: Total debt of another party for which the company is jointly responsible.
        ajuizadas:
          type: integer
          description: How many debt entries are in judicial collection.
        maisAntiga:
          type: string
          description: The day of the oldest debt entry.
          nullable: true
        porNatureza:
          type: object
          description: '`{ naoPrevidenciaria, previdenciaria, fgts }`, each one `{ inscricoes, valor }`.'
        porSituacao:
          type: array
          items:
            type: object
          description: '`{ tipo, inscricoes, valor }` per status type, the highest value first.'
        maiores:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaInscricao'
          description: The 10 debt entries with the highest value.
        mais:
          type: integer
          description: How many debt entries were left out of the list.
        referencia:
          type: string
          description: 'The source snapshot: the month that closes the PGFN quarter (`2026-06`) or the day of publication at the Federal Revenue.'
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database (`AAAA-MM-DD`).
        fonte:
          type: string
          description: Who publishes the data set.
      required:
      - inscricoes
      - valor
      - valorCorresponsavel
      - ajuizadas
      - maisAntiga
      - porNatureza
      - porSituacao
      - maiores
      - mais
      - referencia
      - conferidoEm
      - fonte
      description: The federal active debt of the company, in the quarterly PGFN snapshot.
