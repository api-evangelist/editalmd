            type: object
          description: 'Each entry: `cnpj`, `empregador`, `anoAcao`, `uf`, `estabelecimento`, `trabalhadores`, `cnae`, `decisao`, `inclusao`, `inclusaoTexto` (the periods, as the source writes them) and `saidaPrevista` (two years later).'
        referencia:
          type: string
          description: The day of the snapshot that the source published (`YYYY-MM-DD`).
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database.
          nullable: true
        fonte:
          type: string
          description: A fonte oficial.
      required:
      - consta
      - itens
      - referencia
      - conferidoEm
      - fonte
      description: The MTE Employer Register (the dirty list of labor analogous to slavery), for the whole company.
    ConsultaBeneficios:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaBeneficio'
          description: Up to 30, the newest first.
        mais:
          type: boolean
          description: '`true` when the company has more than 30.'
        importacao:
          type: object
          description: '`{ ano, valor }`: the total import waiver in the newest year of the company; `null` without a waiver.'
          nullable: true
        referencia:
          type: string
          description: 'The source snapshot: the month that closes the PGFN quarter (`2026-06`) or the day of publication at the Federal Revenue.'
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database (`AAAA-MM-DD`).
        fonte:
          type: string
          description: Who publishes the data set.
      required:
      - itens
      - mais
      - importacao
      - referencia
      - conferidoEm
      - fonte
      description: The company's tax benefits (SISEN, ECF, DIRBI and the import tax waivers of the Transparency Portal).
    ConsultaContumaz:
      type: object
      properties:
        cnpj:
          type: string
          description: The qualified CNPJ (the head office, when the record is of a branch).
        razaoSocial:
          type: string
          description: The legal name, as the list shows it.
          nullable: true
        qualificacao:
          type: string
          description: The day of the qualification as a chronic tax debtor (`YYYY-MM-DD`).
          nullable: true
        motivo:
          type: string
          description: The reasons for the qualification, as the list shows them.
          nullable: true
        ente:
          type: string
          description: The federal, state or municipal authority responsible for the qualification.
          nullable: true
        ato:
          type: string
          description: The declaratory act in the Federal Official Gazette (an in.gov.br URL).
          nullable: true
      required:
      - cnpj
      - razaoSocial
      - qualificacao
      - motivo
      - ente
      - ato
      description: A CNPJ of the company on the Federal Revenue chronic tax debtor list.
    ConsultaOrgaoContratante:
      type: object
      properties:
        orgao:
          type: string
          description: The contracting agency (corporate name).
          nullable: true
        uf:
          type: string
          description: The state code of the agency (`SP`, `BA`…).
          nullable: true
        esfera:
          type: string
          description: '`federal`, `estadual`, `municipal` or `distrital`.'
          nullable: true
        quantidade:
          type: integer
          description: How many contracts with the company.
        valor:
          type: number
          description: The sum of their total value, in reais.
      required:
      - orgao
      - uf
      - esfera
      - quantidade
      - valor
      description: An agency that contracted the company, with what it contracted from it.
    ConsultaCnpj:
      type: object
      properties:
        consulta:
          type: string
          description: Always `cnpj`.
        temas:
          type: array
          items:
            type: string
          description: Selected topics, in catalog order. Present only when the request uses temas.
        cnpj:
          type: string
          description: CNPJ formatado.
        empresa:
          type: object
          description: 'The Federal Revenue (Receita) record: corporate name, trade name, status and special status (`situacaoEspecial`: `{ codigo, label, gravidade, descricao, data }` in bankruptcy, judicial recovery, liquidation, intervention or estate, with `daMatriz: true` on a branch that inherited it from the head office; `null` when there is none), opening date, legal nature, size, capital, CNAEs, address, Simples/MEI and partners; individual partners, phones, fax and e-mail are masked (`mascarado: true`).'
        sancoes:
          allOf:
          - $ref: '#/components/schemas/ConsultaSancoes'
          description: The company's sanctions in the public registers; `null` when they could not be checked now.
          nullable: true
        cnia:
          allOf:
          - $ref: '#/components/schemas/ConsultaCnia'
          description: 'The CNIA (administrative misconduct, CNJ), checked live: up to ~6 s the first time for a CNPJ, when the TCU generates the certificate; `null` when it did not answer in time.'
          nullable: true
        dividaAtiva:
          allOf:
          - $ref: '#/components/schemas/ConsultaDividaAtiva'
          description: The federal active debt (PGFN) of the whole company; zero when the snapshot shows nothing.
          nullable: true
        parcelamentos:
          allOf:
          - $ref: '#/components/schemas/ConsultaParcelamentos'
          description: The installment plans at the Federal Revenue (conventional, special, ordinary, Simples, MEI).
          nullable: true
        regimeTributario:
          allOf:
          - $ref: '#/components/schemas/ConsultaRegime'
          description: The taxation method declared in the ECF, per year (Lucro Real, Presumido, Arbitrado, immune or exempt).
          nullable: true
        beneficiosFiscais:
          allOf:
          - $ref: '#/components/schemas/ConsultaBeneficios'
          description: 'The tax benefits: qualified special regimes (SISEN), IRPJ/CSLL waivers in the ECF and the ones declared in the DIRBI.'
          nullable: true
        obras:
          allOf:
          - $ref: '#/components/schemas/ConsultaObras'
          description: The construction works for which the company is responsible (CNO); zero when it has none.
          nullable: true
        devedorContumaz:
          allOf:
          - $ref: '#/components/schemas/ConsultaDevedorContumaz'
          description: 'The Federal Revenue chronic tax debtor list: `consta: true` when the company is on it and is barred from public tenders; `consta: false` and an empty `itens` when it is not.'
          nullable: true
        ambiental:
          allOf:
          - $ref: '#/components/schemas/ConsultaAmbiental'
          description: The Ibama infraction notices and embargoes; zero when the snapshot shows nothing.
          nullable: true
        trabalhoEscravo:
          allOf:
          - $ref: '#/components/schemas/ConsultaTrabalhoEscravo'
          description: 'The dirty list of labor analogous to slavery (MTE); `consta: false` when the company is not on it.'
          nullable: true
        governo:
          allOf:
          - $ref: '#/components/schemas/ConsultaGoverno'
          description: 'The government contracts (PNCP); `quantidade: 0` when the company has no published contract.'
          nullable: true
        pagamentos:
          allOf:
          - $ref: '#/components/schemas/ConsultaPagamentos'
          description: 'The federal government payments (federal bank orders) in the last 12 months; `quantidade: 0` when none.'
          nullable: true
        notasFederais:
          allOf:
          - $ref: '#/components/schemas/ConsultaNotasFederais'
          description: 'The sales to federal agencies by invoice in the 12 months up to the newest month; `notas: 0` when none.'
          nullable: true
        contratosFederais:
          allOf:
          - $ref: '#/components/schemas/ConsultaContratosFederais'
          description: 'The federal government contracts since 2013 (Transparency Portal); `quantidade: 0` when none.'
          nullable: true
        campanhas:
          allOf:
          - $ref: '#/components/schemas/ConsultaCampanhas'
          description: 'The election campaigns that contracted the company (TSE, since 2018); `quantidade: 0` when none.'
          nullable: true
        municipiosSp:
          allOf:
          - $ref: '#/components/schemas/ConsultaMunicipiosSp'
          description: 'The sales to São Paulo city halls, city councils and municipal agencies (TCE-SP, since 2008); `anos: []` when none.'
          nullable: true
        pep:
          allOf:
          - $ref: '#/components/schemas/ConsultaPep'
          description: 'The partners on the list of politically exposed persons (CGU); `quantidade: 0` when none is on it.'
          nullable: true
        registros:
          allOf:
          - $ref: '#/components/schemas/ConsultaRegistros'
          description: The records at regulatory agencies (CVM, Central Bank, ANS, ANTT, ANP, ANEEL, Anatel, Anvisa, CNES, Cadastur, Ibama, ANAC and SICAF); `itens` is empty when the company appears in none.
          nullable: true
        bndes:
          allOf:
          - $ref: '#/components/schemas/ConsultaBndes'
          description: 'The non-automatic BNDES financings; `contratos: 0` when there are none.'
          nullable: true
        fundos:
          allOf:
          - $ref: '#/components/schemas/ConsultaFundos'
          description: 'The investment funds (CVM): the fund itself and the ones the company serves; `fundos: 0` and `proprio: null` when none.'
          nullable: true
        ponto:
          allOf:
          - $ref: '#/components/schemas/ConsultaPonto'
          description: The address on the map; `null` when the CEP is not in the CNEFE.
          nullable: true
        uso:
          allOf:
          - $ref: '#/components/schemas/ConsultaUso'
          description: Who paid for this lookup.
        _links:
          type: object
          description: '`self`, `cnpj`, `cep`, `pagina` e `api_index` absolutos.'
      required:
      - consulta
      - cnpj
      - empresa
      - uso
      - _links
      description: The public company record, its sanctions (with the CNIA), its tax situation (federal active debt, installment plans, tax regime, tax benefits, CNO construction works and the chronic tax debtor list), its socio-environmental risk (Ibama infraction notices and embargoes, and the slave labor dirty list) and where the address is.
    ConsultaEndereco:
      type: object
      properties:
        consulta:
          type: string
          description: 'Always `cep`: it identifies the address lookup.'
        escopo:
          type: string
          description: 'Always `cadastro`: public read at no charge.'
        cep:
          type: string
          description: CEP formatado.
        endereco:
          type: object
          description: 'CEP summary: units, buildings, neighborhood, city, state, IBGE code, center (lat/lon) and types.'
          nullable: true
        pontos:
          type: array
          items:
            type: object
          description: Up to 20 addresses with street, number, neighborhood, city, state, coordinates and type.
        pontos_total:
          type: integer
          description: Number of addresses that the origin returned before the cut to 20.
        empresas:
          allOf:
          - $ref: '#/components/schemas/ConsultaEmpresasDoCep'
          description: First page of companies at the CEP; null when the source does not answer.
          nullable: true
        fonte:
          type: string
          description: Attribution of the address source.
          nullable: true
      required:
      - consulta
      - escopo
      - cep
      - endereco
      - pontos
      - pontos_total
      - empresas
      - fonte
      description: Public addresses of the CEP. It does not include usage, balance or package offers.
    ConsultaPlanoAtivo:
      type: object
      properties:
        oferta:
          type: string
          description: ID of the purchased offer.
        nome:
          type: string
          description: Offer name in the requested language.
        restantes:
          type: integer
          description: Lookups still left in this purchase.
        valido_ate:
          type: string
          description: Until when it is valid (ISO).
          nullable: true
      required:
      - oferta
      - nome
      - restantes
      - valido_ate
      description: A plan or package of the owner that is in force.
    ConsultaCnia:
      type: object
      properties:
        situacao:
          type: string
          description: '`nada_consta` or `constam_registros`.'
        registros:
          type: array
          items:
            type: string
          description: The certificate lines when there are records (up to 20).
        conferidoEm:
          type: string
          description: When the certificate was issued (ISO).
        cnpjs:
          type: array
          items:
            type: string
          description: 'The CNPJs checked: the requested one and, for a branch, the head office.'
        link:
          type: string
          description: The public CNJ lookup, to check by hand.
      required:
      - situacao
      - registros
      - conferidoEm
      - cnpjs
      - link
      description: 'The CNJ CNIA (National Register of Civil Convictions for Administrative Misconduct and Ineligibility), checked LIVE through the consolidated TCU lookup: the CNJ does not publish the register in bulk. For a branch, the head office is checked too.'
    ConsultaOperacaoBndes:
      type: object
      properties:
        contrato:
          type: string
          description: The contract number (the same in each of its subcredits).
        data:
          type: string
          description: The contract date (`YYYY-MM-DD`).
          nullable: true
        valorContratado:
          type: number
          description: The contracted amount, in reais.
          nullable: true
        valorDesembolsado:
          type: number
          description: The disbursed amount, in reais.
          nullable: true
        produto:
          type: string
          description: '`BNDES FINEM`, `BNDES FINAME`, `BNDES PROJECT FINANCE`…'
          nullable: true
        forma:
          type: string
          description: '`DIRETA` or `INDIRETA` (through an intermediary bank, in `agente`).'
          nullable: true
        situacao:
          type: string
          description: '`ATIVO` or `LIQUIDADO`.'
          nullable: true
        projeto:
          type: string
          description: The description of the financed project.
          nullable: true
      required:
      - contrato
      - data
      - valorContratado
      - valorDesembolsado
      - produto
      - forma
      - situacao
      - projeto
      description: 'A non-automatic BNDES operation (a subcredit): direct or through an intermediary bank.'
    ConsultaObra:
      type: object
      properties:
        cno:
          type: string
          description: The number of the construction work in the CNO (`01.001.00922/78`).
        nome:
          type: string
          description: The name of the construction work. In the free record, it comes without a CPF, and a person's name in it comes masked (`RESIDENCIA MARIA S.`).
          nullable: true
        papel:
          type: string
          description: 'The role of the company: `construtora`, `donoDaObra`, `incorporador`, `proprietario`, `consorcio`, `nomeColetivo` or `liderDeConsorcio`.'
          nullable: true
        endereco:
          type: string
          description: The address of the construction work (street, number, neighborhood). In the free record, the number comes as `•••` when the work belongs to a sole proprietor, carries a person's name or is a family house (single-family or affordable).
          nullable: true
        municipio:
          type: string
          description: The municipality of the construction work.
          nullable: true
        uf:
          type: string
          description: The state (UF) of the construction work.
          nullable: true
        area:
          type: number
          description: The total area.
          nullable: true
        unidade:
          type: string
          description: The area unit (`m2`, `m3`, `km`…).
          nullable: true
        situacao:
          type: string
          description: '`ativa`, `paralisada`, `suspensa`, `encerrada` or `nula`.'
          nullable: true
        situacaoEm:
          type: string
          description: The day of the status (`YYYY-MM-DD`).
          nullable: true
        inicio:
          type: string
          description: The start of the construction work (`YYYY-MM-DD`).
          nullable: true
        cnpj:
          type: string
          description: The responsible CNPJ (sometimes another establishment of the same company).
        categoria:
          type: string
          description: 'The category of the main area: `Obra Nova`, `Existente`, `Reforma`…'
          nullable: true
        destinacao:
          type: string
          description: 'The intended use: `Residencial multifamiliar`, `Comercial salas e lojas`…'
          nullable: true
        tipoObra:
          type: string
          description: 'O tipo: `Alvenaria`, `Madeira`, `Mista`…'
          nullable: true
        cnae:
          type: object
          description: 'The CNAE of the construction work: `{ codigo, descricao }`.'
          nullable: true
        vinculo:
          type: boolean
          description: The company is on the construction work through a link (it was responsible before, or is jointly responsible).
        vinculoAte:
          type: string
          description: The end of the link (`YYYY-MM-DD`); empty while it is responsible.
          nullable: true
      required:
      - cno
      - nome
      - papel
      - endereco
      - municipio
      - uf
      - area
      - unidade
      - situacao
      - situacaoEm
      - inicio
      - cnpj
      - categoria
      - destinacao
      - tipoObra
      - cnae
      - vinculo
      - vinculoAte
      description: A construction work in the CNO (National Register of Construction Works, Federal Revenue).
    ConsultaSancoes:
      type: object
      properties:
        total:
          type: integer
          description: Records of the company in the five registers.
        vigentes:
          type: integer
          description: How many of them are in force today.
        porCadastro:
          type: object
          description: '`{ ceis, cnep, cepim, leniencia, tcu }`, each one `{ total, vigentes }`.'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaSancao'
          description: Up to 50, the ones in force first and the newest first.
        mais:
          type: boolean
          description: '`true` when the company has more than 50 records.'
        conferidoEm:
          type: object
          description: 'The snapshot day of each register (`{ ceis: "2026-09-28", … }`).'
        cadastros:
          type: array
          items:
            type: object
          description: 'The five registers: `cadastro`, `nome`, `titulo` and `orgao`.'
      required:
      - total
      - vigentes
      - porCadastro
      - itens
      - mais
      - conferidoEm
      - cadastros
      description: The sanctions of the COMPANY (the CNPJ root) in CEIS, CNEP, CEPIM, the leniency agreements (CGU) and the TCU list of debarred bidders, updated every day; legal entities only.
    ConsultaAutosIbama:
      type: object
      properties:
        quantidade:
          type: number
          description: How many infraction notices are in force.
        valor:
          type: number
          description: The sum of the fines from 1995 on (before that, the value is in an old currency).
        maisRecente:
          type: string
          description: The day of the newest infraction notice (`YYYY-MM-DD`).
          nullable: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaAutoIbama'
          description: The ten newest infraction notices.
        mais:
          type: number
          description: How many infraction notices were left out of `itens`.
        referencia:
          type: string
          description: The day of the snapshot that the source published (`YYYY-MM-DD`).
          nullable: true
        conferidoEm:
          type: string
          description: The day the snapshot entered the database.
          nullable: true
        fonte:
          type: string
          description: A fonte oficial.
      required:
      - quantidade
      - valor
      - maisRecente
      - itens
      - mais
      - referencia
      - conferidoEm
      - fonte
      description: The Ibama infraction notices of the whole company.
    ConsultaFranquia:
      type: object
