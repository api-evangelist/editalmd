        notas:
          type: integer
          description: How many sale invoices in these 12 months; `0` when none.
        desde:
          type: string
          description: The first summed month (`YYYY-MM`).
        ate:
          type: string
          description: The newest month that the CGU published (`YYYY-MM`).
        compradores:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaCompradorFederal'
          description: The five units that bought the most, by value.
        anos:
