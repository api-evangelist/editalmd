        devedor:
          type: string
          description: '`principal`, `corresponsavel`, `solidario` or `outro`.'
        cnpj:
          type: string
          description: The registered CNPJ (sometimes another establishment of the same company).
        receita:
          type: string
          description: The tax or main revenue item (IRPJ, PIS, contribution…).
          nullable: true
        tipo:
          type: string
          description: In collection, tax benefit (in installments), guaranteed, suspended…
          nullable: true
        situacao:
          type: string
          description: 'The status of the debt entry: entered, filed in court, protested…'
          nullable: true
        inscritaEm:
          type: string
          description: The day of the debt entry (`YYYY-MM-DD`).
          nullable: true
        ajuizada:
          type: boolean
          description: '`true` when the collection is already in court.'
        valor:
          type: number
          description: Consolidated amount in the snapshot, in reais.
      required:
      - inscricao
      - natureza
      - devedor
      - cnpj
      - receita
      - tipo
      - situacao
      - inscritaEm
      - ajuizada
      - valor
