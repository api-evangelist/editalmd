        '431':
          description: Cookie header above 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; the limit of four simultaneous operations was reached.
      tags:
      - Credito
components:
  schemas:
    OfertaDeAssinatura:
      type: object
      properties:
        id:
          type: string
          description: 'Offer ID: 2 to 64 characters; a letter first, then lowercase letters, numbers, hyphens or underscores.'
        produto:
          type: string
          description: Product of the offer; same format as the ID.
        versao:
          type: integer
          description: Version from 1 to 1,000,000.
        preco_centavos:
          type: integer
          description: 'Monthly price in cents: from 500 to 1,000,000.'
        moeda:
          type: string
          description: 'Moeda fixa: BRL.'
        ciclo:
          type: string
          description: 'Periodicidade fixa: MONTHLY.'
        renovacao_automatica:
          type: boolean
          description: 'true: repeats the monthly charge until the cancellation.'
        compromisso_meses:
          type: integer
          description: '1: one monthly period.'
        cancelamento:
          type: string
          description: 'stop_future_charges: stops new charges.'
        acesso_pago:
          type: string
          description: 'until_paid_period_end: keeps the access until the end of the paid period.'
        teste_dias:
          type: integer
          description: Configured period from 0 to 30 days. The catalog does not grant a trial or benefit.
        conversao_teste:
          type: string
          description: 'opt_in: the trial does not subscribe or renew by inference.'
        beneficios:
          type: array
          items:
            $ref: '#/components/schemas/BeneficioDeAssinatura'
          description: From 1 to 8 distinct capabilities per paid period.
        hash:
          type: string
          description: 'SHA-256 of the full offer: 64 lowercase hexadecimal characters.'
      required:
      - id
      - produto
      - versao
      - preco_centavos
      - moeda
      - ciclo
      - renovacao_automatica
      - compromisso_meses
      - cancelamento
      - acesso_pago
      - teste_dias
      - conversao_teste
      - beneficios
      - hash
    BeneficioDeAssinatura:
      type: object
      properties:
        sku:
          type: string
          description: 'Product capability: a lowercase letter followed by letters, numbers or underscores; up to 64 characters.'
        quantidade:
          type: integer
          description: Units from 1 to 1,000,000 for each paid period.
      required:
      - sku
      - quantidade
    RegistroDeAssinatura:
      type: object
      properties:
        recurso:
          type: string
          description: 'Product resource: up to 256 characters, without control characters. It filters the subscription of your own account; empty means a purchase per account.'
        id:
          type: string
          description: Local ID of 32 hexadecimal characters; it identifies the lookup and the cancellation.
        oferta_id:
          type: string
          description: ID of the accepted offer.
        oferta:
          allOf:
          - $ref: '#/components/schemas/OfertaDeAssinatura'
          description: Offer recorded at acceptance. A change in the catalog does not replace this record.
        estado:
          type: string
          description: criando, inconclusiva, checkout, aguardando_pagamento, ativa, cancelando, cancelada, falhou or expirada.
        simulado:
          type: boolean
          description: 'Environment that the server recorded: true for sandbox, false for production.'
        pagamento_em:
          type: string
          description: Null for a subscription made through the API. Old records can have an Asaas HTTPS link in the checkout state.
          nullable: true
        criado_em:
          type: string
          description: UTC date and time when the subscription was created.
        atualizado_em:
          type: string
          description: UTC date and time of the last change.
        cancelamento_em:
          type: string
          description: UTC date and time of the cancellation request, or null.
          nullable: true
        cancelado_em:
          type: string
          description: UTC date and time of the confirmed cancellation, or null.
          nullable: true
      required:
      - recurso
      - id
      - oferta_id
      - oferta
      - estado
      - simulado
      - pagamento_em
      - criado_em
      - atualizado_em
      - cancelamento_em
      - cancelado_em
    AceiteDeAssinatura:
      type: object
      properties:
        oferta_id:
          type: string
          description: ID received in the current catalog.
        versao:
          type: integer
          description: Version received in the current catalog.
        hash:
          type: string
          description: 64-character hash received in the current catalog.
        renovacao:
          type: boolean
          description: Must be true after the explicit acceptance of the monthly charge and the renewal.
      required:
      - oferta_id
      - versao
      - hash
      - renovacao
    CartaoDeAssinatura:
      type: object
      properties:
        titular:
          type: string
          description: 'Name on the card: 3 to 100 characters.'
        numero:
          type: string
          description: Valid number with 13 to 19 digits; spaces and separators are accepted.
        mes:
          type: string
          description: 'Expiry month: 1 to 12.'
        ano:
          type: string
          description: Expiry year with four digits; the card must not be expired.
        cvv:
          type: string
          description: 'Security code: three digits; four for American Express.'
        documento:
          type: string
          description: Valid CPF or CNPJ of the holder.
        email:
          type: string
          description: 'E-mail of the holder: up to 254 characters.'
        cep:
          type: string
          description: 'Billing CEP of the holder: eight digits.'
        numero_endereco:
          type: string
          description: 'Number of the billing address: up to 20 characters.'
        telefone:
          type: string
          description: 'Phone of the holder: 10 to 13 digits.'
      required:
      - titular
      - numero
      - mes
      - ano
      - cvv
      - documento
      - email
      - cep
      - numero_endereco
      - telefone
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
