      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Signed, valid staging ticket. Without it, the body flag does not authorize sandbox.
      responses:
        '200':
          description: '{ id, cursor }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
                  cursor:
                    type: string
                    description: State version. Compare it for equality; do not read it as a payment confirmation.
                required:
                - id
                - cursor
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session; an API key does not authorize these requests.
        '403':
          description: Invalid origin or cookie; for writes, invalid CSRF protection.
        '404':
