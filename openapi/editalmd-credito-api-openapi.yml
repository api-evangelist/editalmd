      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Origem HTTPS exata deste produto.
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: 64-character token from the session bootstrap of this product. It protects against requests from another site.
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
