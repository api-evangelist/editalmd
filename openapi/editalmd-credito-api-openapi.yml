  /api/credito/assinaturas/{id}/estado:
    get:
      operationId: get_api_credito_assinaturas_by_id_estado
      summary: Follows changes to your own subscription through the real-time channel
      description: 'Requires active monthly sales, or staging enabled and a test payment that the server authorizes. Without this authorization, it answers 404. Requires a human session of this product. It returns only the ID and the cursor, also after a reconnection. The signal does not grant paid access and does not expose financial data. When it changes, read the authenticated subscription record. Reading the record keeps the checks of environment, payee and resource.

        Returns: { id, cursor }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
        example: 0123456789abcdef0123456789abcdef
      - name: dev
        in: query
        required: false
