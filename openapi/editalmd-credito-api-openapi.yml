      summary: Gets your own subscription and the accepted offer, without creating a payment
      description: 'Requires active monthly sales, or staging enabled and a test payment that the server authorizes. Without this authorization, it answers 404. Requires a valid session of this product. It does not query the provider. Sandbox also requires a valid ticket for reading.

        Returns: { recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
