      summary: Stops future charges of your own subscription and keeps the paid period
      description: 'Requires active monthly sales, or staging enabled and a test payment that the server authorizes. Without this authorization, it answers 404. Send only {} as JSON up to 4 KiB, with a valid session, origin and CSRF. It records the request before it calls Asaas. A pending cancellation is not a confirmed cancellation. You can repeat the same request. Refunds have their own process; this request does not refund the payment.

        Returns: { recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
