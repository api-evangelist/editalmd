openapi: 3.2.0
info:
  title: EditalMD Precos API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Precos
paths:
  /api/precos:
    get:
      operationId: get_api_precos
      summary: 'The winning price for a similar item, in summary: how many prices, the median…'
      description: 'Look up awarded results by item description. The free summary has `n`, the median and the range (p25/p75) of the comparable ones (the same catalog product, in the same unit, without the extremes, `comparacao`), the other groups that the search found (`grupos`: ask for the `produto` and `unidade` of one of them to switch), the volume bought, the price for your `quantidade` (or that of the item of the open `compra`) and how much more the small purchase pays, `amostra` (the criterion: up to 2,000 items most similar by text) and `detalhe`: the address (of the same group), the price and the size of the full winning-price report (`GET /api/precos/detalhe`, paid per lookup): who wins, who buys, by state, by month, the other numbers of the summary and the items. It also accepts POST, PUT or PATCH with the same parameters in JSON or a form; `query`, `termo`, `busca` and `search` count as `q`, `estado` as `uf`, `limit` as `limite`. Every 400 has `exemplo` and `doc`. `Accept: text/html` opens the Prices paid tab with the query.

        Returns: { consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, resumo{n,mediana,p25,p75,ultima_homologacao,volume}, amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, detalhe{url,preco_usd,preco_brl,unidades_plano,inclui,previa}, base_legal, pago }'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Item description; at least 3 letters, up to 200.
      - name: uf
        in: query
        required: false
        schema:
          type: string
        description: State (UF) abbreviation of the buying agency.
      - name: meses
        in: query
        required: false
        schema:
          type: integer
          default: 12
        description: Award window in months, 1 to 36.
      - name: catmat
        in: query
        required: false
        schema:
          type: string
        description: Item code in the government catalog, up to 64 characters.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: 1 a 100 itens.
      - name: produto
        in: query
        required: false
        schema:
          type: string
        description: Catalog product, as in `grupos` (up to 80 letters); without it, the largest group.
      - name: unidade
        in: query
        required: false
        schema:
          type: string
        description: Unit, as in `grupos` (`500 FL`, `1 UN`).
      - name: quantidade
        in: query
        required: false
        schema:
          type: number
        description: 'How much you will sell, in the group unit: the price of the range of that quantity.'
      - name: compra
        in: query
        required: false
        schema:
          type: integer
        description: 'Procurement id in the collection: the quantity comes from its item, in the compared group. An item in a package without the count (`Embalagem FL`) does not count: the unit does not say how many sheets.'
      responses:
        '200':
          description: '{ consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, resumo{n,mediana,p25,p75,ultima_homologacao,volume}, amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, detalhe{url,preco_usd,preco_brl,unidades_plano,inclui,previa}, base_legal, pago }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecosGratis'
        '400':
          description: Short term, or state, months, limit, catmat, product, unit, quantity or procurement outside the contract, with `exemplo` and `doc`.
        '502':
          description: Origin unavailable.
        '503':
          description: 'Slow search: `busca_demorada`, with `Retry-After`; refine the term or filter by state.'
      tags:
      - Precos
  /api/precos/detalhe:
    get:
      operationId: get_api_precos_detalhe
      summary: 'Full report: who wins, who buys, by state, by month and the items.'
      description: 'The same parameters as `/api/precos`. Without payment, a 402 with the two doors (x402 and credit); paid, the whole `resumo` (lowest, highest, average, median discount on the value estimated by the agency, share of ME/EPP small businesses, distinct suppliers and buyers), `por_uf`, `por_mes`, `vencedores` (top 10 by items and value, with company size), `compradores` (top 10 agencies), `por_quantidade` (the median and the range by procurement size) and the sample of `itens`, each one with its procurement: everything from the same comparable group (`comparacao`: same product, same unit, without the extremes). An individual winner comes without the CPF. On credit, the same lookup with the same token does not charge again. Private answer, no cache.

        Returns: { consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, estatisticas{total,media,mediana,menor,maior,desvio_padrao}, resumo{n,mediana,p25,p75,menor,maior,media,desconto_mediano,com_referencia,me_epp,valor_total,fornecedores,volume,compradores,ultima_homologacao}, por_uf[{uf,n,mediana,menor,maior,fornecedores,compradores,ultima_homologacao}], por_mes[{mes,n,mediana,menor,maior}], vencedores[{fornecedor_cnpj,pessoa_fisica,fornecedor,porte,itens,valor_total,menor,maior,compradores,ultima_homologacao}], compradores[{orgao_cnpj,orgao,uf,itens,compras,valor_total,fornecedores,ultima_homologacao}], amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, por_quantidade[{faixa,de,ate,n,mediana,p25,p75,menor,maior,volume,fornecedores,compradores,ultima_homologacao}], itens[{compra_id,item,resultado,pncp,referencia,descricao,unidade,catmat,material_ou_servico,valor_unitario,valor_unitario_estimado,quantidade_homologada,fornecedor,fornecedor_cnpj,pessoa_fisica,fornecedor_porte,orgao,orgao_cnpj,municipio,uf,modalidade,homologado_em,publicado_em,compra_url}], base_legal, pago, pagamento? }'
      x-price-usd: 0.5
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Item description; at least 3 letters, up to 200.
      - name: uf
        in: query
        required: false
        schema:
          type: string
        description: State (UF) abbreviation of the buying agency.
      - name: meses
        in: query
        required: false
        schema:
          type: integer
          default: 12
        description: Award window in months, 1 to 36.
      - name: catmat
        in: query
        required: false
        schema:
          type: string
        description: Item code in the government catalog, up to 64 characters.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: 1 a 100 itens.
      - name: produto
        in: query
        required: false
        schema:
          type: string
        description: Catalog product, as in `grupos` (up to 80 letters); without it, the largest group.
      - name: unidade
        in: query
        required: false
        schema:
          type: string
        description: Unit, as in `grupos` (`500 FL`, `1 UN`).
      - name: quantidade
        in: query
        required: false
        schema:
          type: number
        description: 'How much you will sell, in the group unit: the price of the range of that quantity.'
      - name: compra
        in: query
        required: false
        schema:
          type: integer
        description: 'Procurement id in the collection: the quantity comes from its item, in the compared group. An item in a package without the count (`Embalagem FL`) does not count: the unit does not say how many sheets.'
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
        description: x402 authorization of the 402 challenge.
      - name: X-Credito
        in: header
        required: false
        schema:
          type: string
        description: cred_… token to deduct from the balance, as an alternative to x402.
      responses:
        '200':
          description: '{ consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, estatisticas{total,media,mediana,menor,maior,desvio_padrao}, resumo{n,mediana,p25,p75,menor,maior,media,desconto_mediano,com_referencia,me_epp,valor_total,fornecedores,volume,compradores,ultima_homologacao}, por_uf[{uf,n,mediana,menor,maior,fornecedores,compradores,ultima_homologacao}], por_mes[{mes,n,mediana,menor,maior}], vencedores[{fornecedor_cnpj,pessoa_fisica,fornecedor,porte,itens,valor_total,menor,maior,compradores,ultima_homologacao}], compradores[{orgao_cnpj,orgao,uf,itens,compras,valor_total,fornecedores,ultima_homologacao}], amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, por_quantidade[{faixa,de,ate,n,mediana,p25,p75,menor,maior,volume,fornecedores,compradores,ultima_homologacao}], itens[{compra_id,item,resultado,pncp,referencia,descricao,unidade,catmat,material_ou_servico,valor_unitario,valor_unitario_estimado,quantidade_homologada,fornecedor,fornecedor_cnpj,pessoa_fisica,fornecedor_porte,orgao,orgao_cnpj,municipio,uf,modalidade,homologado_em,publicado_em,compra_url}], base_legal, pago, pagamento? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Precos'
        '400':
          description: Short term, or state, months, limit, catmat, product, unit, quantity or procurement outside the contract, with `exemplo` and `doc`.
        '402':
          description: Payment required or refused; it announces x402 and credit.
        '502':
          description: '`pago_sem_entrega`: paid and the origin did not answer; repeat the same lookup with the same credit.'
        '503':
          description: Detail without a configured price, or a slow search.
      tags:
      - Precos
    post:
      operationId: post_api_precos_detalhe
      summary: Open the full report with the plan allowance, single credit or payment
      description: 'An authenticated account uses 25 plan units before the credit. A cookie requires CSRF. Repeating the same valid lookup does not deduct again. Without enough allowance, the single charge follows. The same parameters as `/api/precos`. Without payment, a 402 with the two doors (x402 and credit); paid, the whole `resumo` (lowest, highest, average, median discount on the value estimated by the agency, share of ME/EPP small businesses, distinct suppliers and buyers), `por_uf`, `por_mes`, `vencedores` (top 10 by items and value, with company size), `compradores` (top 10 agencies), `por_quantidade` (the median and the range by procurement size) and the sample of `itens`, each one with its procurement: everything from the same comparable group (`comparacao`: same product, same unit, without the extremes). An individual winner comes without the CPF. On credit, the same lookup with the same token does not charge again. Private answer, no cache.

        Returns: { consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, estatisticas{total,media,mediana,menor,maior,desvio_padrao}, resumo{n,mediana,p25,p75,menor,maior,media,desconto_mediano,com_referencia,me_epp,valor_total,fornecedores,volume,compradores,ultima_homologacao}, por_uf[{uf,n,mediana,menor,maior,fornecedores,compradores,ultima_homologacao}], por_mes[{mes,n,mediana,menor,maior}], vencedores[{fornecedor_cnpj,pessoa_fisica,fornecedor,porte,itens,valor_total,menor,maior,compradores,ultima_homologacao}], compradores[{orgao_cnpj,orgao,uf,itens,compras,valor_total,fornecedores,ultima_homologacao}], amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, por_quantidade[{faixa,de,ate,n,mediana,p25,p75,menor,maior,volume,fornecedores,compradores,ultima_homologacao}], itens[{compra_id,item,resultado,pncp,referencia,descricao,unidade,catmat,material_ou_servico,valor_unitario,valor_unitario_estimado,quantidade_homologada,fornecedor,fornecedor_cnpj,pessoa_fisica,fornecedor_porte,orgao,orgao_cnpj,municipio,uf,modalidade,homologado_em,publicado_em,compra_url}], base_legal, pago, pagamento? }'
      x-price-usd: 0.5
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Item description; at least 3 letters, up to 200.
      - name: uf
        in: query
        required: false
        schema:
          type: string
        description: State (UF) abbreviation of the buying agency.
      - name: meses
        in: query
        required: false
        schema:
          type: integer
          default: 12
        description: Award window in months, 1 to 36.
      - name: catmat
        in: query
        required: false
        schema:
          type: string
        description: Item code in the government catalog, up to 64 characters.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: 1 a 100 itens.
      - name: produto
        in: query
        required: false
        schema:
          type: string
        description: Catalog product, as in `grupos` (up to 80 letters); without it, the largest group.
      - name: unidade
        in: query
        required: false
        schema:
          type: string
        description: Unit, as in `grupos` (`500 FL`, `1 UN`).
      - name: quantidade
        in: query
        required: false
        schema:
          type: number
        description: 'How much you will sell, in the group unit: the price of the range of that quantity.'
      - name: compra
        in: query
        required: false
        schema:
          type: integer
        description: 'Procurement id in the collection: the quantity comes from its item, in the compared group. An item in a package without the count (`Embalagem FL`) does not count: the unit does not say how many sheets.'
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
        description: x402 authorization of the 402 challenge.
      - name: X-Credito
        in: header
        required: false
        schema:
          type: string
        description: cred_… token to deduct from the balance, as an alternative to x402.
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Account transport token for writes by cookie.
      responses:
        '200':
          description: '{ consulta{q,expressao,uf,catmat,produto,unidade,quantidade,compra,meses,desde,limite}, estatisticas{total,media,mediana,menor,maior,desvio_padrao}, resumo{n,mediana,p25,p75,menor,maior,media,desconto_mediano,com_referencia,me_epp,valor_total,fornecedores,volume,compradores,ultima_homologacao}, por_uf[{uf,n,mediana,menor,maior,fornecedores,compradores,ultima_homologacao}], por_mes[{mes,n,mediana,menor,maior}], vencedores[{fornecedor_cnpj,pessoa_fisica,fornecedor,porte,itens,valor_total,menor,maior,compradores,ultima_homologacao}], compradores[{orgao_cnpj,orgao,uf,itens,compras,valor_total,fornecedores,ultima_homologacao}], amostra{candidatos,limitada,criterio,desde,ate}, comparacao{produto,unidade,comparaveis,no_grupo,validos,sem_produto,criterio}, grupos[{produto,unidade,n}], faixa_da_quantidade{quantidade,origem,faixa,de,ate,n,mediana,p25,p75}, variacao_por_quantidade, por_quantidade[{faixa,de,ate,n,mediana,p25,p75,menor,maior,volume,fornecedores,compradores,ultima_homologacao}], itens[{compra_id,item,resultado,pncp,referencia,descricao,unidade,catmat,material_ou_servico,valor_unitario,valor_unitario_estimado,quantidade_homologada,fornecedor,fornecedor_cnpj,pessoa_fisica,fornecedor_porte,orgao,orgao_cnpj,municipio,uf,modalidade,homologado_em,publicado_em,compra_url}], base_legal, pago, pagamento? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Precos'
        '400':
          description: Short term, or state, months, limit, catmat, product, unit, quantity or procurement outside the contract, with `exemplo` and `doc`.
        '402':
          description: Payment required or refused; it announces x402 and credit.
        '502':
          description: '`pago_sem_entrega`: paid and the origin did not answer; repeat the same lookup with the same credit.'
        '503':
          description: Detail without a configured price, or a slow search.
      tags:
      - Precos
components:
  schemas:
    PrecosResumoGratis:
      type: object
      properties:
        n:
          type: integer
          description: Valid awarded results in the period.
        mediana:
          type: number
          description: Median of the unit values, in reais.
          nullable: true
        p25:
          type: number
          description: First quartile (25 % of the results below).
          nullable: true
        p75:
          type: number
          description: Third quartile (75 % of the results below).
          nullable: true
        ultima_homologacao:
          type: string
          description: Date of the most recent result, `AAAA-MM-DD`.
          nullable: true
        volume:
          type: number
          description: 'Sum of the awarded quantities in the group, in its unit: the size of the market in the period.'
          nullable: true
      required:
      - n
      - mediana
      - p25
      - p75
      - ultima_homologacao
      - volume
    PrecosComparacao:
      type: object
      properties:
        produto:
          type: string
          description: Catalog product (the PDM of CATMAT/CATSER, from the start of the description); null when it is free text.
          nullable: true
        unidade:
          type: string
          description: 'Quantity and base of the supply unit: `500 FL`, `1 UN`, `5000 ML` (liter becomes ml).'
          nullable: true
        comparaveis:
          type: integer
          description: Results that entered the calculation (the `n` of the summary).
        no_grupo:
          type: integer
          description: Results of the group before removing the extremes.
        validos:
          type: integer
          description: Valid awarded results in the period, from all the groups.
        sem_produto:
          type: integer
          description: Results in free text, without a catalog product.
        criterio:
          type: string
          description: The criterion, in full.
      required:
      - produto
      - unidade
      - comparaveis
      - no_grupo
      - validos
      - sem_produto
      - criterio
      description: 'The group that entered the calculation: the same catalog product and the same supply unit, without the prices below 50 % or above 150 % of the median (unfeasible, a lot entered with quantity 1, a swapped unit).'
    PrecoVencedor:
      type: object
      properties:
        fornecedor_cnpj:
          type: string
          description: CNPJ, digits only; null for an individual (the CPF is not published).
          nullable: true
        pessoa_fisica:
          type: boolean
          description: '`true` when the winner is an individual.'
        fornecedor:
          type: string
          description: Corporate name or name, as published.
          nullable: true
        porte:
          type: string
          description: Porte declarado (ME, EPP, Demais).
          nullable: true
        itens:
          type: integer
          description: Items awarded to this supplier.
        valor_total:
          type: number
          description: Sum of the awarded total values, in reais.
          nullable: true
        menor:
          type: number
          description: Lowest unit value that this supplier won.
          nullable: true
        maior:
          type: number
          description: Highest unit value that this supplier won.
          nullable: true
        compradores:
          type: integer
          description: Distinct agencies that bought from it.
        ultima_homologacao:
          type: string
          description: Last win, `AAAA-MM-DD`.
          nullable: true
      required:
      - fornecedor_cnpj
      - pessoa_fisica
      - fornecedor
      - porte
      - itens
      - valor_total
      - menor
      - maior
      - compradores
      - ultima_homologacao
      description: 'Who wins this item: a supplier, with what it won in the period.'
    PrecoComprador:
      type: object
      properties:
        orgao_cnpj:
          type: string
          description: Agency CNPJ, digits only.
          nullable: true
        orgao:
          type: string
          description: Buying agency.
          nullable: true
        uf:
          type: string
          description: State (UF) of the agency.
          nullable: true
        itens:
          type: integer
          description: Items awarded by this agency.
        compras:
          type: integer
          description: Distinct purchases (procurement processes) where the item was awarded.
        valor_total:
          type: number
          description: Sum of the awarded total values, in reais.
          nullable: true
        fornecedores:
          type: integer
          description: Distinct suppliers that sold to it.
        ultima_homologacao:
          type: string
          description: Last awarded procurement, `AAAA-MM-DD`.
          nullable: true
      required:
      - orgao_cnpj
      - orgao
      - uf
      - itens
      - compras
      - valor_total
      - fornecedores
      - ultima_homologacao
      description: 'Who buys this item: an agency, with how many times and when it bought.'
    PrecosDetalheOferta:
      type: object
      properties:
        url:
          type: string
          description: '`POST` of the detail of the same lookup; it uses the account allowance first (`/api/precos/detalhe`).'
        preco_usd:
          type: string
          description: Price per lookup (`$0.50`), through the two doors (x402 or credit).
          nullable: true
        preco_brl:
          type: number
          description: Single price in reais, by the payment quote of the server.
          nullable: true
        unidades_plano:
          type: number
          description: 'Plan units per report: 25. Reopening the same valid lookup does not deduct again.'
          nullable: true
        inclui:
          type: array
          items:
            type: string
          description: What the detail has beyond the summary.
        previa:
          allOf:
          - $ref: '#/components/schemas/PrecosPrevia'
          description: The size of the detail of this lookup.
      required:
      - url
      - preco_usd
      - preco_brl
      - unidades_plano
      - inclui
      - previa
    PrecosEstatisticas:
      type: object
      properties:
        total:
          type: integer
          description: How many unit values entered the calculation.
        media:
          type: number
          description: Average of the unit values, in reais.
          nullable: true
        mediana:
          type: number
          description: Median of the unit values.
          nullable: true
        menor:
          type: number
          description: Lowest unit value.
          nullable: true
        maior:
          type: number
          description: Highest unit value.
          nullable: true
        desvio_padrao:
          type: number
          description: Population standard deviation.
          nullable: true
      required:
      - total
      - media
      - mediana
      - menor
      - maior
      - desvio_padrao
    PrecosPorMes:
      type: object
      properties:
        mes:
          type: string
          description: '`YYYY-MM` of the approval.'
        n:
          type: integer
          description: Results in the month; `0` when there were none.
        mediana:
          type: number
          description: Median of the unit values in the month.
          nullable: true
        menor:
          type: number
          description: Lowest unit value in the month.
          nullable: true
        maior:
