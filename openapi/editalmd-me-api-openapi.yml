openapi: 3.2.0
info:
  title: EditalMD Me API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Me
paths:
  /api/me/empresas/{cnpj}/documentos:
    get:
      operationId: get_api_me_empresas_by_cnpj_documentos
      summary: Lists the private attachments of the company; it does not start reading or…
      description: 'Returns: { itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      responses:
        '200':
          description: '{ itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentosEmpresa'
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
    post:
      operationId: post_api_me_empresas_by_cnpj_documentos
      summary: Adds a PDF of a certificate of performance, a certificate or another proof to…
      description: '201. JSON up to 11,200,000 bytes; PDF up to 8 MiB, 20 documents/80 MiB/50 pages per company. An identical file is reused. The automatic reading happens only when the analysis is requested.

        Returns: { itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Name up to 160 characters.
                tipo:
                  type: string
                  description: atestado, certidao, licenca, contrato_social or outro.
                arquivo_base64:
                  type: string
                  description: 'PDF in canonical base64, without the data: prefix. Prefer an HTTP upload from the local file.'
      responses:
        '200':
          description: '{ itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentosEmpresa'
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
  /api/me/empresas/{cnpj}/documentos/{arquivo}:
    get:
      operationId: get_api_me_empresas_by_cnpj_documentos_by_arquivo
      summary: Downloads the private PDF, without an AI call
      description: 'Returns: binary PDF with Content-Disposition: attachment; use authenticated HTTP to download.'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      - name: arquivo
        in: path
        required: true
        schema:
          type: string
        description: SHA-256 retornado no envio.
        example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        '200':
          description: 'Binary PDF with Content-Disposition: attachment; use authenticated HTTP to download.'
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
    delete:
      operationId: delete_api_me_empresas_by_cnpj_documentos_by_arquivo
      summary: Removes the attachment of this company and invalidates the analysis that used it
      description: 'Returns: { itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      - name: arquivo
        in: path
        required: true
        schema:
          type: string
        description: SHA-256 of the attachment.
        example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        '200':
          description: '{ itens[{id,nome,tipo,bytes,paginas,enviado_em}], revisao, limite, limite_bytes, limite_paginas }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentosEmpresa'
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
  /api/me/empresas/{cnpj}/analises/{id}:
    post:
      operationId: post_api_me_empresas_by_cnpj_analises_by_id
      summary: Starts or resumes the comparison of requirements, certificates of performance…
      description: '202 after accepting and keeping the request; 200 when reusing a completed analysis. It uses the profile and attachments of this owner. Interrupted requests can resume; failures give the reason and the next action. An explicit POST resumes a pause. Up to 2 thousand facts and 100 tender documents per company, subject to the available capacity and budget. This operation does not charge a new purchase. Follow-up only through GET. The analysis offers screening with evidence, not a final qualification decision or an external legal opinion.

        Returns: { analise }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the document with a ready dossier and authorized access.
        example: 1993401
      - name: v
        in: query
        required: true
        schema:
          type: string
        description: SHA-256 of the opened Markdown, 64 lowercase hex characters.
      responses:
        '200':
          description: '{ analise }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  analise:
                    type: object
                    description: 'Estado inicial: id, status, etapa, processados, total, CNPJ, hashes e datas.'
                required:
                - analise
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
    get:
      operationId: get_api_me_empresas_by_cnpj_analises_by_id
      summary: Reads the progress or the paginated results; it does not start AI or change the…
      description: 'Pending items group precisa_comprovar (proof missing), divergente (incompatible evidence) and acompanhar (future obligation). A different registry, attachments or dossier return outdated without current results. The reference date is kept on resume; a previous day returns data_atual=false. The validated batches stay available during failures/processing with parcial=true and processados/total; they never represent a conclusion on the requirements not compared yet. GET does not run the queue or start AI.

        Returns: { analise, itens, contagens?, tipos?, next }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: CNPJ of 14 characters (digits or alphanumeric) linked to the owner.
        example: 00394460000141
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document ID.
        example: 1993401
      - name: v
        in: query
        required: true
        schema:
          type: string
        description: SHA-256 of the opened Markdown, 64 lowercase hex characters.
      - name: grupo
        in: query
        required: false
        schema:
          type: string
        description: pendencias, atendidos or nao_aplicavel; when omitted, all are returned.
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: requirement, attestation or obligation.
      - name: after
        in: query
        required: false
        schema:
          type: integer
        description: Last received ID; default 0.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: 1 to 30; default 30.
      responses:
        '200':
          description: '{ analise, itens, contagens?, tipos?, next }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnaliseParticipacao'
        '400':
          description: Invalid input.
        '401':
          description: Account session or valid guest required.
        '402':
          description: Access to the tender document required.
        '403':
          description: Origem recusada.
        '404':
          description: Company or document missing for this owner.
        '409':
          description: Sources or checkpoint unavailable.
        '413':
          description: Limit of documents, pages or bytes.
        '429':
          description: Processing in progress; try again later.
        '502':
          description: Core unavailable.
        '503':
          description: Configuration or processing budget unavailable.
      tags:
      - Me
  /api/me/empresas:
    get:
      operationId: get_api_me_empresas
      summary: Lists the requester's companies (the account organizations with EditalMD) and…
      description: 'Returns: { itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
      responses:
        '200':
          description: '{ itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresasConta'
        '400':
          description: Invalid CNPJ or search.
        '401':
          description: Account required (conta_necessaria) or session ended; the search accepts the guest.
        '403':
          description: Origin refused, account key (organization_key_required), role without management (organization_role_required) or shared without 2FA (organization_mfa_required).
        '404':
          description: Company not in the requester's organizations, or CNPJ not in the base.
        '405':
          description: Method not allowed.
        '409':
          description: Limit of 100 companies, a given organization that already has a company, or an organization that the requester left.
        '429':
          description: Cap of new organizations of the account.
        '503':
          description: Origin, account or budget unavailable.
      tags:
      - Me
  /api/me/empresas/busca:
    get:
      operationId: get_api_me_empresas_busca
      summary: Searches up to eight suggestions by corporate name or full CNPJ; it does not…
      description: 'Returns: { itens[{cnpj,nome,municipio,uf,situacao}] }'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: CNPJ with or without punctuation, or corporate name, from 3 to 120 characters.
      responses:
        '200':
          description: '{ itens[{cnpj,nome,municipio,uf,situacao}] }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/SugestaoEmpresa'
                    description: Up to eight results; refine the search when necessary.
                required:
                - itens
        '400':
          description: Invalid CNPJ or search.
        '401':
          description: Account required (conta_necessaria) or session ended; the search accepts the guest.
        '403':
          description: Origin refused, account key (organization_key_required), role without management (organization_role_required) or shared without 2FA (organization_mfa_required).
        '404':
          description: Company not in the requester's organizations, or CNPJ not in the base.
        '405':
          description: Method not allowed.
        '409':
          description: Limit of 100 companies, a given organization that already has a company, or an organization that the requester left.
        '429':
          description: Cap of new organizations of the account.
        '503':
          description: Origin, account or budget unavailable.
      tags:
      - Me
  /api/me/empresas/{cnpj}:
    put:
      operationId: put_api_me_empresas_by_cnpj
      summary: Imports the registry data into an organization of the account
      description: 'Without X-Organization-Id, it creates the organization with the corporate name and EditalMD enabled, or returns the one that the person removed from the list (201). With X-Organization-Id or an organization key, the record goes to this organization, if the requester manages it and it has no company. 200 when the CNPJ is already in an organization of the requester. Up to 100 companies; without partners or contacts; no analysis is started.

        Returns: { itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: Full CNPJ, 14 digits with valid check digits.
        example: 00394460000141
      responses:
        '200':
          description: '{ itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresasConta'
        '400':
          description: Invalid CNPJ or search.
        '401':
          description: Account required (conta_necessaria) or session ended; the search accepts the guest.
        '403':
          description: Origin refused, account key (organization_key_required), role without management (organization_role_required) or shared without 2FA (organization_mfa_required).
        '404':
          description: Company not in the requester's organizations, or CNPJ not in the base.
        '405':
          description: Method not allowed.
        '409':
          description: Limit of 100 companies, a given organization that already has a company, or an organization that the requester left.
        '429':
          description: Cap of new organizations of the account.
        '503':
          description: Origin, account or budget unavailable.
      tags:
      - Me
    delete:
      operationId: delete_api_me_empresas_by_cnpj
      summary: Removes the company from the list (owner or administrator); the organization…
      description: 'Returns: { itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
        description: Full CNPJ, 14 digits with valid check digits.
        example: 00394460000141
      responses:
        '200':
          description: '{ itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresasConta'
        '400':
          description: Invalid CNPJ or search.
        '401':
          description: Account required (conta_necessaria) or session ended; the search accepts the guest.
        '403':
          description: Origin refused, account key (organization_key_required), role without management (organization_role_required) or shared without 2FA (organization_mfa_required).
        '404':
          description: Company not in the requester's organizations, or CNPJ not in the base.
        '405':
          description: Method not allowed.
