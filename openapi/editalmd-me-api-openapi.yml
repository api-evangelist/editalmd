      operationId: put_api_me_empresas_by_cnpj_selecionar
      summary: Selects a company already registered to work on the tender document
      description: 'The choice of each person, kept in the account. It does not run an analysis; repeating the current choice does not write.

        Returns: { itens[{cnpj,razao_social,nome_fantasia,situacao,situacao_desde,porte,natureza_juridica,inicio_atividade,matriz_filial,capital_social,municipio,uf,cnaes,fonte,importado_em,organizacao}], selecionada, selecionada_organizacao, limite, conta_necessaria }'
      parameters:
      - name: cnpj
        in: path
        required: true
        schema:
          type: string
