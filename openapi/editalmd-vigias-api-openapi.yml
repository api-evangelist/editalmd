openapi: 3.2.0
info:
  title: EditalMD Vigias API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Vigias
paths:
  /api/vigias:
    post:
      operationId: post_api_vigias
      summary: 'Watches a procurement: it takes a snapshot now and notifies when it changes…'
      description: 'The first active watch is free (`FRANQUIA_VIGIAS`); the next ones cost `PRECO_VIGIA` until 30 days after the closing. Repeating the same procurement, channel and destination of this owner returns the active watch with 200, without a new charge; a creation returns 201. The checks are periodic; check the date of the last check in the watch. The notices `prazo_impugnacao` (on the day) and `prazo_proposta` (24 h before) go out once each.

        Returns: { vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos}, pagamento }'
      x-price-usd: 0.05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compra_id:
                  type: integer
                  description: Procurement identifier in the collection, from the search.
                canal:
                  type: string
                  description: '`pull` (read at `/eventos`), `webhook` or `email` (verified e-mail of the account; requires a session).'
                  enum:
                  - pull
                  - webhook
                  - email
                destino:
                  type: string
                  description: Public https URL on port 443, without a credential (webhook). Ignored for pull and e-mail.
              required:
              - compra_id
            example:
              compra_id: 42
              canal: pull
      responses:
        '200':
          description: '{ vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos}, pagamento }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vigia:
                    allOf:
                    - $ref: '#/components/schemas/Vigia'
                    description: The created watch, or the active one that this owner already has.
                  snapshot:
                    allOf:
                    - $ref: '#/components/schemas/Snapshot'
                    description: The initial procurement snapshot.
                  pagamento:
                    type: object
                    description: '`via` (franquia, credito, x402 or existente), `preco_usd` and `pago_ate`. Repetition: `via: existente`, `preco_usd: $0.00`, `repetido: true`.'
                required:
                - vigia
                - snapshot
                - pagamento
        '400':
          description: Invalid `compra_id`, channel or destination.
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '402':
          description: 'Above the allowance without payment: the x402 `accepts[]` and the credit path.'
        '403':
          description: '`email_exige_conta`: e-mail channel without the account session; or `invalid_origin`/`invalid_csrf` on a write with the account cookie.'
        '404':
          description: Procurement not found in the collection.
        '502':
          description: '`pago_nao_registrado`: the payment came in and the recording of the purchase failed; keep the `recibo`; the watch was not created.'
        '503':
          description: E-mail channel off, or origin unavailable.
      tags:
      - Vigias
    get:
      operationId: get_api_vigias
      summary: Lists the watches of this owner, newest first
      description: 'Returns: { itens[{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}], franquia_vigias }'
      responses:
        '200':
          description: '{ itens[{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}], franquia_vigias }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vigia'
                    description: Up to 50 watches of the owner.
                  franquia_vigias:
                    type: integer
                    description: How many active watches are free.
                required:
                - itens
                - franquia_vigias
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Vigias
  /api/vigias/{id}:
    get:
      operationId: get_api_vigias_by_id
      summary: A watch of the owner with the most recent snapshot of the procurement
      description: 'Returns: { vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos} }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Watch identifier, returned at creation.
        example: 2b7e…
      responses:
        '200':
          description: '{ vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vigia:
                    allOf:
                    - $ref: '#/components/schemas/Vigia'
                    description: A vigia.
                  snapshot:
                    allOf:
                    - $ref: '#/components/schemas/Snapshot'
                    description: What the cron saw last.
                required:
                - vigia
                - snapshot
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Watch that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Vigias
    delete:
      operationId: delete_api_vigias_by_id
      summary: Deletes the watch and its events. There is no undo
      description: 'Returns: 204 with no body.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Watch identifier.
        example: 2b7e…
      responses:
        '200':
          description: 204 with no body.
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Watch that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Vigias
  /api/vigias/{id}/eventos:
    get:
      operationId: get_api_vigias_by_id_eventos
      summary: 'What changed in the watched procurement, event by event: it is the time series…'
      description: 'Returns: { vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos}, itens[{id,tipo,antes,depois,visto_em,entregue_em}], limite }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Watch identifier.
        example: 2b7e…
      - name: limite
        in: query
        required: false
        schema:
          type: integer
        description: 1 to 100 (default 50), most recent first.
      responses:
        '200':
          description: '{ vigia{id,compra_id,canal,destino,ativo,pago_ate,ultimo_check,criado_em,vigia_url,eventos_url,compra_url}, snapshot{situacao_id,situacao,encerramento_proposta,valor_estimado,atualizado_em,documentos}, itens[{id,tipo,antes,depois,visto_em,entregue_em}], limite }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vigia:
                    allOf:
                    - $ref: '#/components/schemas/Vigia'
                    description: A vigia.
                  snapshot:
                    allOf:
                    - $ref: '#/components/schemas/Snapshot'
                    description: A fotografia atual.
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evento'
                    description: Eventos registrados.
                  limite:
                    type: integer
                    description: Teto aplicado.
                required:
                - vigia
                - snapshot
                - itens
                - limite
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Watch that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Vigias
components:
  schemas:
    Vigia:
      type: object
      properties:
        id:
          type: string
          description: Watch identifier.
        compra_id:
          type: integer
          description: Watched purchase in the collection.
        canal:
          type: string
          description: '`pull`, `webhook` or `email`.'
        destino:
          type: string
          description: Webhook URL; null for pull and e-mail.
          nullable: true
        ativo:
          type: boolean
          description: Whether the cron still checks again; it ends 30 days after the end of bidding.
        pago_ate:
          type: string
          description: End of the paid validity; null in the allowance.
          nullable: true
        ultimo_check:
          type: string
          description: Last recheck.
          nullable: true
        criado_em:
          type: string
          description: Creation in ISO 8601.
        vigia_url:
          type: string
          description: URL desta vigia.
        eventos_url:
          type: string
          description: Where to read the events (pull).
        compra_url:
          type: string
          description: Procurement record.
      required:
      - id
      - compra_id
      - canal
      - destino
      - ativo
      - pago_ate
      - ultimo_check
      - criado_em
      - vigia_url
      - eventos_url
      - compra_url
      description: 'A watched procurement: notice channel, validity and the cron cursor.'
    Snapshot:
      type: object
      properties:
        situacao_id:
          type: integer
          description: 'Status: 1 published, 2 revoked, 3 annulled, 4 suspended.'
          nullable: true
        situacao:
          type: string
          description: Status in full.
          nullable: true
        encerramento_proposta:
          type: string
          description: End of bidding seen in the snapshot.
          nullable: true
        valor_estimado:
          type: number
          description: Estimated value seen in the snapshot.
          nullable: true
        atualizado_em:
          type: string
          description: Last known update of the procurement.
          nullable: true
        documentos:
          type: array
          items:
            type: object
          description: 'Documents by PNCP sequence number: `sequencial`, `id`, `titulo`, `tipo`.'
      required:
      - situacao_id
      - situacao
      - encerramento_proposta
      - valor_estimado
      - atualizado_em
      - documentos
      description: The procurement snapshot that the watch compares.
    Evento:
      type: object
      properties:
        id:
          type: string
          description: Event identifier.
        tipo:
          type: string
          description: '`situacao`, `prazo_adiado`, `valor`, `documento_novo`, `documento_removido`, `prazo_impugnacao` or `prazo_proposta`.'
        antes:
          type: string
          description: Previous value; null for a new document and in deadline notices.
          nullable: true
        depois:
          type: string
          description: New value; null for a removed document.
          nullable: true
        visto_em:
          type: string
          description: When the cron saw it.
        entregue_em:
          type: string
          description: When the notice went out by webhook or e-mail; null for pull or on failure.
          nullable: true
      required:
      - id
      - tipo
      - antes
      - depois
      - visto_em
      - entregue_em
      description: A change seen in the watched procurement, or a deadline notice.
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
