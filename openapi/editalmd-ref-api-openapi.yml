openapi: 3.2.0
info:
  title: EditalMD Ref API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Ref
paths:
  /api/ref:
    get:
      operationId: get_api_ref
      summary: Search municipality names, activities and other Radar CNPJ reference data
      description: 'Returns: { ok, results }'
      parameters:
      - name: tipo
        in: query
        required: true
        schema:
          type: string
        description: municipio, cnae, natureza, qualificacao, pais or motivo.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Two to 60 characters. Optional when codes are supplied.
      - name: codigos
        in: query
        required: false
        schema:
          type: string
        description: Up to 50 Receita codes, separated by commas. These are not IBGE codes.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: From 1 to 50 results; default 20.
      responses:
        '200':
          description: '{ ok, results }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: True when the reference lookup succeeds.
                  results:
                    type: array
                    items:
                      type: object
                    description: References with codigo, descricao and, for municipalities, uf. Use the name and state to filter tenders.
                required:
                - ok
                - results
        '400':
          description: Invalid reference type or search.
        '429':
          description: Origin limit.
        '503':
          description: Reference data unavailable.
      tags:
      - Ref
components:
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
