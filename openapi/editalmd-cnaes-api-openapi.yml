openapi: 3.2.0
info:
  title: EditalMD Cnaes API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Cnaes
paths:
  /api/cnaes:
    get:
      operationId: get_api_cnaes
      summary: Economic activities (CNAE), descriptions and term suggestions for alerts. Free
      description: 'Without `q`, it lists the activities with the most registered suppliers. With `q`, it searches by code prefix (`1412`, `1412-6/01`) or by a word of the description. Null `familia`/`termos` say that the CNAE is not in the dictionary yet: an alert by CNPJ does not use it.

        Returns: { itens[{codigo,cnae,descricao,familia,familia_nome,termos,fornecedores_sicaf,sicaf_medido_em,ibge_atualizado_em}], limite, q, dicionario, fontes }'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Code prefix (2 to 7 digits) or a word of the description (2+ letters).
      - name: limite
        in: query
        required: false
        schema:
          type: integer
        description: 1 to 100 (default 20), by suppliers in SICAF, descending.
      responses:
        '200':
          description: '{ itens[{codigo,cnae,descricao,familia,familia_nome,termos,fornecedores_sicaf,sicaf_medido_em,ibge_atualizado_em}], limite, q, dicionario, fontes }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cnae'
                    description: The CNAEs that match, the ones with the most suppliers first.
                  limite:
                    type: integer
                    description: Teto aplicado.
                  q:
                    type: string
                    description: O filtro aplicado.
                    nullable: true
                  dicionario:
                    type: object
                    description: '`familias`, `cnaes_mapeados` and `medido_em` (when the coverage in the collection was measured).'
                  fontes:
                    type: object
                    description: Source attribution of the data shown.
                required:
                - itens
                - limite
                - q
                - dicionario
                - fontes
        '400':
          description: '`q` with fewer than 2 characters.'
        '503':
          description: Database unavailable.
      tags:
      - Cnaes
components:
  schemas:
    Cnae:
      type: object
      properties:
        codigo:
          type: string
          description: 7 digits.
        cnae:
          type: string
          description: Formatado, ex. `1412-6/01`.
        descricao:
          type: string
          description: Official description (IBGE/Concla).
          nullable: true
        familia:
          type: string
          description: Family of terms in the dictionary; null if not mapped yet.
          nullable: true
        familia_nome:
          type: string
          description: Family name.
          nullable: true
        termos:
          type: string
          description: Terms that an alert by CNPJ would use for this CNAE.
          nullable: true
        fornecedores_sicaf:
          type: integer
          description: Active suppliers with this CNAE in SICAF (open data of compras.gov.br).
          nullable: true
        sicaf_medido_em:
          type: string
          description: When this count was measured.
          nullable: true
        ibge_atualizado_em:
          type: string
          description: When the description was updated from IBGE.
          nullable: true
      required:
      - codigo
      - cnae
      - descricao
      - familia
      - familia_nome
      - termos
      - fornecedores_sicaf
      - sicaf_medido_em
      - ibge_atualizado_em
      description: 'A CNAE (subclass) as the product sees it: official description, dictionary and suppliers in SICAF.'
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
