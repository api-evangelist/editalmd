openapi: 3.2.0
info:
  title: EditalMD Dono API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Dono
paths:
  /api/dono:
    post:
      operationId: post_api_dono
      summary: Creates the guest (edm_… token) that opens alerts and watches, and the secret…
      description: 'The token is issued and signed by the account library, with a cap per network and per hour, so that the free allowance does not become infinite. It is shown only once and cannot be recovered: sign in to the account and bring the lists to it (`POST /api/auth/claim`, which the account page does by itself at sign-in) so that you do not depend on it. The `webhook_segredo` can be read again at `GET /api/dono`. Every webhook POST has `webhook-id`, `webhook-timestamp` (Unix seconds) and `webhook-signature: v1,`: HMAC-SHA256 of `id.timestamp.corpo` with the key of your `whsec_…` (the base64 after the prefix). It is the Standard Webhooks pattern: any library of it checks it; reject a timestamp outside 5 minutes. After `POST /api/dono/segredo`, the previous one still signs for 24 h (two `v1,` parts in the header).

        Returns: { token, aviso, webhook_segredo, webhook_assinatura, franquia }'
      responses:
        '200':
          description: '{ token, aviso, webhook_segredo, webhook_assinatura, franquia }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dono'
        '429':
          description: The network passed the hourly cap of guests.
        '503':
          description: Account or database unavailable.
      tags:
      - Dono
    get:
      operationId: get_api_dono
      summary: 'The state of the owner: account or guest, notice e-mail, allowance and the…'
      description: 'Every webhook POST has `webhook-id`, `webhook-timestamp` (Unix seconds) and `webhook-signature: v1,`: HMAC-SHA256 of `id.timestamp.corpo` with the key of your `whsec_…` (the base64 after the prefix). It is the Standard Webhooks pattern: any library of it checks it; reject a timestamp outside 5 minutes. After `POST /api/dono/segredo`, the previous one still signs for 24 h (two `v1,` parts in the header).

        Returns: { tipo, email_alertas, webhook_segredo, assinatura, franquia }'
      responses:
        '200':
          description: '{ tipo, email_alertas, webhook_segredo, assinatura, franquia }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipo:
                    type: string
                    description: '`conta` (session) or `convidado` (edm_… token).'
                  email_alertas:
                    type: string
                    description: Verified e-mail of the account, masked, where the notices of the e-mail channel go; null for the guest.
                    nullable: true
                  webhook_segredo:
                    type: string
                    description: '`whsec_…`: the key that signs each webhook POST.'
                  assinatura:
                    type: string
                    description: How to check the signature, in one line.
                  franquia:
                    type: object
                    description: '`alertas_gratis` and `vigias_gratis` included.'
                required:
                - tipo
                - email_alertas
                - webhook_segredo
                - assinatura
                - franquia
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Dono
  /api/dono/segredo:
    post:
      operationId: post_api_dono_segredo
      summary: Rotates the webhook secret.
      description: 'During the 24 h, the `webhook-signature` header has two `v1,…` parts: one with the new secret, the other with the previous one. The receiver only needs to accept any one that matches.

        Returns: { webhook_segredo, anterior_valido_ate }'
      responses:
        '200':
          description: '{ webhook_segredo, anterior_valido_ate }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_segredo:
                    type: string
                    description: O novo `whsec_…`.
                  anterior_valido_ate:
                    type: string
                    description: Until when the previous secret still signs (ISO 8601).
                required:
                - webhook_segredo
                - anterior_valido_ate
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Dono
components:
  schemas:
    Dono:
      type: object
      properties:
        token:
          type: string
          description: '`edm_…` issued by the account library: keep it; it is not shown again and cannot be recovered.'
        aviso:
          type: string
          description: Reminder to keep the token and how to use it.
        webhook_segredo:
          type: string
          description: '`whsec_…`: it signs every webhook POST (Standard Webhooks). Read it again at `GET /api/dono`; rotate it at `POST /api/dono/segredo`.'
        webhook_assinatura:
          type: string
          description: How to check the signature, in one line.
        franquia:
          type: object
          description: '`alertas_gratis` and `vigias_gratis` included.'
      required:
      - token
      - aviso
      - webhook_segredo
      - webhook_assinatura
      - franquia
      description: The guest (owner token), shown only once, the secret that signs the webhooks and the allowance.
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
