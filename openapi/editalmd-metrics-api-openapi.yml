openapi: 3.2.0
info:
  title: EditalMD Metrics API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Metrics
paths:
  /api/metrics:
    get:
      operationId: get_api_metrics
      summary: Metrics of the last 7 days for the operator dashboard; with the token, they…
      description: 'Without a credential, it returns visits and usage (markdown deliveries, alerts, watches). With `METRICS_TOKEN` as Bearer, it adds `payments`: only x402 settled on Base mainnet.

        Returns: { app, today, today_visits, today_contacts?, days, usage, accounts, financeiro?, payments? }'
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: '`Bearer <METRICS_TOKEN>` to include the financial block; a wrong token is 401.'
      responses:
        '200':
          description: '{ app, today, today_visits, today_contacts?, days, usage, accounts, financeiro?, payments? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'
        '401':
          description: Wrong operator token.
        '503':
          description: Worker without METRICS_TOKEN configured.
      tags:
      - Metrics
components:
  schemas:
    Metricas:
      type: object
      properties:
        app:
          type: string
          description: Product name.
        today:
          type: string
          description: Reference day (UTC, YYYY-MM-DD).
        today_visits:
          type: integer
          description: Visits counted today by the interface.
        today_contacts:
          type: integer
          description: 'Contact messages today: this product has no form, so it stays at zero. Only with `METRICS_TOKEN`: contact does not come out without the token.'
        days:
          type: array
          items:
            type: object
          description: One record per day of the window, with the counts of each metric.
        usage:
          type: object
          description: 'Uso por recurso: `markdown` (entregas), `alertas` e `vigias` criados, por dia.'
        accounts:
          type: object
          description: 'Empty: people and guests live in the global account, not in the product.'
        financeiro:
          type: object
          description: 'Daily aggregate: `hoje_usd`, `hoje_count`, `rede`. Only with `METRICS_TOKEN`: money data never leaves without a token; the full series is `payments`.'
        payments:
          type: object
          description: x402 financial summary; only with METRICS_TOKEN.
      required:
      - app
      - today
      - today_visits
      - days
      - usage
      - accounts
      description: 7-day operator dashboard. `payments` appears only with the token and only on Base mainnet.
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - public-procurement
  - documents
  - data
  docs:
    homepage: https://editalmd.com/
    apiReference: https://editalmd.com/developers
    llms: https://editalmd.com/llms.txt
