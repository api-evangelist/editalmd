openapi: 3.2.0
info:
  title: EditalMD Recibo API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Recibo
paths:
  /api/recibo/{id}:
    get:
      operationId: get_api_recibo_by_id
      summary: 'Receipt of a delivery: the proof of what was delivered, how much it cost and…'
      description: 'Returns: { recibo{id,recurso,documento_id,preco_usd,modo,sha256_entregue,bytes,criado_em} }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Receipt identifier (32 hex), from the `x-editalmd-recibo` header.
        example: 0c8f2b…
      responses:
        '200':
          description: '{ recibo{id,recurso,documento_id,preco_usd,modo,sha256_entregue,bytes,criado_em} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  recibo:
                    allOf:
                    - $ref: '#/components/schemas/Recibo'
                    description: O recibo.
                required:
                - recibo
        '404':
          description: Receipt not found.
      tags:
      - Recibo
components:
  schemas:
    Recibo:
      type: object
      properties:
        id:
          type: string
          description: Receipt identifier (32 hex).
        recurso:
          type: string
          description: 'Recurso entregue, ex.: `documento/123/markdown`.'
        documento_id:
          type: integer
          description: Documento entregue.
          nullable: true
        preco_usd:
          type: string
          description: 'Charged price: `$0.00` for a sample.'
        modo:
          type: string
          description: '`gratuito`, `homolog` or `onchain`.'
        sha256_entregue:
          type: string
          description: SHA-256 of the delivered markdown, or `nao_entregue`.
        bytes:
          type: integer
          description: Size of what was delivered.
        criado_em:
          type: string
          description: Delivery instant in ISO 8601.
      required:
      - id
      - recurso
      - documento_id
      - preco_usd
      - modo
      - sha256_entregue
      - bytes
      - criado_em
      description: 'Proof of delivery: what was paid, how much, how and the hash of what was delivered.'
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - public-procurement
  - documents
  - data
  docs:
    homepage: https://editalmd.com/
    apiReference: https://editalmd.com/developers
    llms: https://editalmd.com/llms.txt
