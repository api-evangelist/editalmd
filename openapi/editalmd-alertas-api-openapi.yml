openapi: 3.2.0
info:
  title: EditalMD Alertas API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Alertas
paths:
  /api/alertas/previa:
    post:
      operationId: post_api_alertas_previa
      summary: Tests terms and filters or suggests terms by CNPJ, without creating an alert
      description: 'Returns: { sugestoes, itens[{id,pncp,objeto,uf,modalidade,situacao,orgao,unidade,valor_estimado,publicado_em,informacao_complementar,processo,abertura_proposta,encerramento_proposta,amparo_legal,amparo_legal_codigo,modalidade_id,situacao_id,municipio,municipio_ibge,orgao_cnpj,ano_compra,sequencial_compra,atualizado_em,prazos,pncp_url,markdown_url,compra_url}], aviso, periodo_dias?, limite? }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                termos:
                  type: string
                  description: 3 to 200 characters; required without a CNPJ and without `filtros.cnaes`.
                cnpj:
                  type: string
                  description: CNPJ to suggest up to 8 families of terms, without activating them.
                uf:
                  type: string
                  description: State code.
                filtros:
                  allOf:
                  - $ref: '#/components/schemas/FiltrosInteresse'
                  description: 'Additional segment: modalities, municipalities, exclusions, values, open bidding and CNAEs. PATCH replaces the whole segment; {} clears it.'
            example:
              termos: uniforme escolar
              uf: GO
              filtros:
                modalidades:
                - 6
      responses:
        '200':
          description: '{ sugestoes, itens[{id,pncp,objeto,uf,modalidade,situacao,orgao,unidade,valor_estimado,publicado_em,informacao_complementar,processo,abertura_proposta,encerramento_proposta,amparo_legal,amparo_legal_codigo,modalidade_id,situacao_id,municipio,municipio_ibge,orgao_cnpj,ano_compra,sequencial_compra,atualizado_em,prazos,pncp_url,markdown_url,compra_url}], aviso, periodo_dias?, limite? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  sugestoes:
                    type: array
                    items:
                      type: object
                    description: Family, name, editable terms and CNAEs; only in CNPJ mode.
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compra'
                    description: Up to 20 procurements of the last 7 days; each one has a url to the record.
                  aviso:
                    type: string
                    description: Limits of the sample or of the suggestion.
                  periodo_dias:
                    type: integer
                    description: 7, only in the sample by terms.
                  limite:
                    type: integer
                    description: 20, only in the sample by terms.
                required:
                - sugestoes
                - itens
                - aviso
        '400':
          description: Invalid terms, CNPJ, state or filters.
        '404':
          description: Company not found.
        '503':
          description: Origin unavailable.
      tags:
      - Alertas
  /api/alertas:
    post:
      operationId: post_api_alertas
      summary: 'Creates alerts of new procurements: by object terms and state, or by the…'
      description: 'Create alerts by terms or CNPJ. A space requires all groups; `|` accepts alternatives within a group. By CNPJ, each known activity family produces an alert, up to `max_familias`. Unmapped activities remain in the response without an alert. The first active alert is free; extra alerts last 30 days and use allowance, credit or x402. The cron checks every 30 minutes. Email requires a session and `EMAIL_ALERTAS=1`. Without explicit recipients, the notice uses the verified account email.

        Returns: { alerta?{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}, alertas?[{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}], empresa?{cnpj,cnpj_formatado,razao_social,nome_fantasia,situacao,uf,municipio,cnaes}, nao_criados?[{familia,nome,termos,cnaes,motivo}], pagamento }'
      x-price-usd: 0.1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Alert name, up to 100 characters.
                organizacao_id:
                  type:
                  - string
                  - 'null'
                  description: Organization from `GET /api/me/empresas`. Membership and MFA are checked. Null removes the label. This does not share alert ownership.
                destinatarios:
                  allOf:
                  - $ref: '#/components/schemas/DestinatariosAlerta'
                  description: 'Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.'
                termos:
                  type: string
                  description: Words of the procurement object (3 to 200 letters); space = all, `|` = any one of the group. Required without `cnpj`; ignored with `cnpj`.
                cnpj:
                  type: string
                  description: 'Company CNPJ (14 digits, with or without punctuation): the terms come from its activities (CNAE), one alert per family.'
                max_familias:
                  type: integer
                  description: 'Only with `cnpj`: how many families become alerts, the main one first (1 to 8).'
                uf:
                  type: string
                  description: State (UF) abbreviation to restrict; without a state, the whole of Brazil applies.
                filtros:
                  allOf:
                  - $ref: '#/components/schemas/FiltrosInteresse'
                  description: 'Additional segment: modalities, municipalities, exclusions, values, open bidding and CNAEs. PATCH replaces the whole segment; {} clears it.'
                canal:
                  type: string
                  description: '`pull`, `webhook` or `email`. Email requires a session. Without explicit recipients, it uses the account email.'
                  enum:
                  - pull
                  - webhook
                  - email
                destino:
                  type: string
                  description: Public https URL on port 443, without a credential (webhook). Ignored for pull and e-mail.
            example:
              termos: uniforme|fardamento escolar
              uf: GO
              canal: pull
      responses:
        '200':
          description: '{ alerta?{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}, alertas?[{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}], empresa?{cnpj,cnpj_formatado,razao_social,nome_fantasia,situacao,uf,municipio,cnaes}, nao_criados?[{familia,nome,termos,cnaes,motivo}], pagamento }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerta:
                    allOf:
                    - $ref: '#/components/schemas/Alerta'
                    description: O alerta criado (modo termos).
                  alertas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alerta'
                    description: The created alerts, one per family (CNPJ mode).
                  empresa:
                    allOf:
                    - $ref: '#/components/schemas/Empresa'
                    description: The summary record and each CNAE with the family that triggered it (CNPJ mode).
                  nao_criados:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamiliaNaoCriada'
                    description: Families left out by `max_familias` (CNPJ mode).
                  pagamento:
                    type: object
                    description: '`via` (franquia, credito or x402), `preco_usd`, `pago_ate` and, in CNPJ mode, `alertas_pagos` and `preco_unitario_usd`.'
                required:
                - pagamento
        '400':
          description: Invalid terms, CNPJ, state, channel or destination.
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '402':
          description: 'Above the allowance without payment: the x402 `accepts[]` and the credit path.'
        '403':
          description: '`email_exige_conta`: e-mail channel without the account session (a guest has no e-mail); or `invalid_origin`/`invalid_csrf` on a write with the account cookie.'
        '404':
          description: CNPJ not found in the queried base.
        '422':
          description: 'CNPJ without any activity in the dictionary: create by terms (the answer has the CNAEs).'
        '502':
          description: '`pago_nao_registrado`: the payment came in and the recording of the purchase failed; keep the `recibo`; the alert was not created.'
        '503':
          description: E-mail channel off, or the CNPJ lookup unavailable now (`retry_after`).
      tags:
      - Alertas
    get:
      operationId: get_api_alertas
      summary: Lists the alerts of this owner, newest first
      description: 'Returns: { itens[{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}], total, franquia_alertas }'
      responses:
        '200':
          description: '{ itens[{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}], total, franquia_alertas }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alerta'
                    description: Up to 50 alerts of the owner.
                  total:
                    type: integer
                    description: Total of alerts of this owner, including paused ones; it is not limited to the 50 items of the answer.
                  franquia_alertas:
                    type: integer
                    description: How many active alerts are free.
                required:
                - itens
                - total
                - franquia_alertas
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Alertas
  /api/alertas/{id}:
    get:
      operationId: get_api_alertas_by_id
      summary: An alert of the owner, with the filters and the date of the last check
      description: 'Returns: { alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total} }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Alert identifier, returned at creation.
        example: 9f3c…
      responses:
        '200':
          description: '{ alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerta:
                    allOf:
                    - $ref: '#/components/schemas/Alerta'
                    description: O alerta.
                required:
                - alerta
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Alert that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Alertas
    patch:
      operationId: patch_api_alertas_by_id
      summary: Pauses, reactivates or changes the terms, state, filters, channel and…
      description: 'Returns: { alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total} }'
      x-price-usd: 0.1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Alert identifier.
        example: 9f3c…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Alert name, up to 100 characters.
                organizacao_id:
                  type:
                  - string
                  - 'null'
                  description: Organization from `GET /api/me/empresas`. Membership and MFA are checked. Null removes the label. This does not share alert ownership.
                destinatarios:
                  allOf:
                  - $ref: '#/components/schemas/DestinatariosAlerta'
                  description: 'Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.'
                ativo:
                  type: boolean
                  description: '`false` pauses without deleting; `true` reactivates.'
                termos:
                  type: string
                  description: New object terms (3 to 200 letters; `|` = any one of the group).
                uf:
                  type: string
                  description: New state; empty removes the restriction.
                filtros:
                  allOf:
                  - $ref: '#/components/schemas/FiltrosInteresse'
                  description: 'Additional segment: modalities, municipalities, exclusions, values, open bidding and CNAEs. PATCH replaces the whole segment; {} clears it.'
                canal:
                  type: string
                  description: '`pull`, `webhook` or `email`. Email requires a session. Without explicit recipients, it uses the account email.'
                  enum:
                  - pull
                  - webhook
                  - email
                destino:
                  type: string
                  description: New https URL on port 443 (webhook). Ignored for pull and email.
            example:
              ativo: false
      responses:
        '200':
          description: '{ alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerta:
                    allOf:
                    - $ref: '#/components/schemas/Alerta'
                    description: The alert after the change.
                required:
                - alerta
        '400':
          description: Nothing to change or an invalid value.
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '402':
          description: 'Reactivation above the allowance, outside the paid window, without payment: the x402 `accepts[]` and the credit path.'
        '403':
          description: '`email_exige_conta`: e-mail channel without the account session; or `invalid_origin`/`invalid_csrf` on a write with the account cookie.'
        '404':
          description: Alert that does not exist or that belongs to another owner.
        '502':
          description: '`pago_nao_registrado`: the reactivation payment came in and the recording failed; keep the `recibo`; the alert stays paused.'
        '503':
          description: Canal e-mail desligado.
      tags:
      - Alertas
    delete:
      operationId: delete_api_alertas_by_id
      summary: Deletes the alert and the history of matched procurements. There is no undo
      description: 'Returns: 204 with no body.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Alert identifier.
        example: 9f3c…
      responses:
        '200':
          description: 204 with no body.
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Alert that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Alertas
  /api/alertas/{id}/compras:
    get:
      operationId: get_api_alertas_by_id_compras
      summary: 'The procurements that already matched the alert: it is the pull channel, and…'
      description: 'Returns: { alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}, itens[{compra_id,status,visto_em,compra}], limite, proximo_antes }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Alert identifier.
        example: 9f3c…
      - name: limite
        in: query
        required: false
        schema:
          type: integer
        description: 1 to 100 (default 50), highest IDs first.
      - name: antes_compra
        in: query
        required: false
        schema:
          type: integer
        description: Use proximo_antes of the previous page to continue.
      responses:
        '200':
          description: '{ alerta{id,nome,organizacao,destinatarios,termos,origem,uf,filtros,canal,destino,ativo,pago_ate,ultimo_check,falhas_seguidas,criado_em,alerta_url,compras_url,compras_total}, itens[{compra_id,status,visto_em,compra}], limite, proximo_antes }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerta:
                    allOf:
                    - $ref: '#/components/schemas/Alerta'
                    description: O alerta.
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertaCompra'
                    description: Matched procurements, with the delivery status.
                  limite:
                    type: integer
                    description: Teto aplicado.
                  proximo_antes:
                    type: integer
                    description: Cursor of the next page; null at the end.
                    nullable: true
                required:
                - alerta
                - itens
                - limite
                - proximo_antes
        '401':
          description: 'Without a guest token or an account session, an unknown token, a refused wallet credential (`invalid_wallet_token`), or `session_ended` (expired session cookie: sign in again).'
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a write with the account cookie outside the same origin or without X-CSRF-Token.'
        '404':
          description: Alert that does not exist or that belongs to another owner.
        '503':
          description: '`conta_indisponivel`: account down now; nothing changes.'
      tags:
      - Alertas
components:
  schemas:
    OrigemCnae:
      type: object
      properties:
        cnpj:
          type: string
          description: Company CNPJ, 14 characters (digits or alphanumeric).
        familia:
          type: string
          description: Identifier of the family of terms in the dictionary.
        cnae:
          type: string
          description: The first CNAE of the company that triggered the family, 7 digits.
        descricao:
          type: string
          description: Official description (IBGE) of this CNAE.
          nullable: true
        cnaes:
          type: array
          items:
            type: string
          description: All the CNAEs of the company that fall in this family.
      required:
      - cnpj
      - familia
      - cnae
      - descricao
      - cnaes
      description: The company and the activity (CNAE) that generated an alert by CNPJ.
    DestinatariosAlerta:
      type: object
      properties:
        para:
          type: array
          items:
            type: string
          description: To addresses. Empty means the verified account email.
        cc:
          type: array
          items:
            type: string
          description: Visible copy addresses.
        bcc:
          type: array
          items:
            type: string
          description: Hidden copy addresses. Only the alert owner can read this list.
      required:
      - para
      - cc
      - bcc
      description: 'Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.'
    Alerta:
      type: object
      properties:
        id:
          type: string
          description: Alert identifier.
        nome:
          type: string
          description: Alert name, up to 100 characters.
          nullable: true
        organizacao:
          type: object
          description: 'Organization label: `id` and `nome`. The creator retains ownership.'
          nullable: true
        destinatarios:
          allOf:
          - $ref: '#/components/schemas/DestinatariosAlerta'
          description: 'Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.'
          nullable: true
        termos:
          type: string
          description: Words of the object that the alert looks for (`|` = any one of the group).
        origem:
          allOf:
          - $ref: '#/components/schemas/OrigemCnae'
          description: Where an alert created by CNPJ came from; null in the alert by terms.
          nullable: true
        uf:
          type: string
          description: Restricted state, or null for Brazil.
          nullable: true
        filtros:
          allOf:
          - $ref: '#/components/schemas/FiltrosInteresse'
          description: Additional segment of the interest.
        canal:
          type: string
          description: '`pull`, `webhook` or `email`.'
        destino:
          type: string
          description: Webhook URL. For email, read `destinatarios`. Without explicit recipients, the verified account email applies.
          nullable: true
        ativo:
          type: boolean
          description: Whether the cron still checks this alert.
        pago_ate:
          type: string
          description: End of the paid validity; null in the allowance.
          nullable: true
        ultimo_check:
          type: string
          description: Last round; it does not mean that the whole backlog was delivered.
          nullable: true
        falhas_seguidas:
          type: integer
          description: Consecutive deliveries that failed; at 10 the alert pauses.
        criado_em:
          type: string
          description: Creation in ISO 8601.
        alerta_url:
          type: string
          description: URL deste alerta.
        compras_url:
          type: string
          description: Where to read the matched purchases (pull).
        compras_total:
          type: integer
          description: Number of tenders already found by this alert, across all pages. This is not the filter preview count.
          nullable: true
      required:
      - id
      - nome
      - organizacao
      - destinatarios
      - termos
      - origem
      - uf
      - filtros
      - canal
      - destino
      - ativo
      - pago_ate
      - ultimo_check
      - falhas_seguidas
      - criado_em
      - alerta_url
      - compras_url
      - compras_total
      description: 'An alert of new procurements: terms, state, filters and delivery channel.'
    Compra:
      type: object
      properties:
        id:
          type: integer
          description: 'Internal procurement identifier: it is the one that opens the record.'
        pncp:
          type: string
          description: PNCP control number of the procurement.
          nullable: true
        objeto:
          type: string
          description: Procurement object, as published.
          nullable: true
        uf:
          type: string
          description: Abbreviation of the federative unit of the agency.
          nullable: true
        modalidade:
          type: string
          description: Modality (electronic reverse auction, direct award…).
          nullable: true
        situacao:
          type: string
          description: Procurement status on PNCP.
          nullable: true
        orgao:
          type: string
          description: Corporate name of the buying agency.
          nullable: true
        unidade:
          type: string
          description: Responsible administrative unit.
          nullable: true
        valor_estimado:
          type: number
          description: Total estimated value in reais.
          nullable: true
        publicado_em:
          type: string
          description: Publication date on PNCP.
          nullable: true
        informacao_complementar:
          type: string
          description: Published additional information.
          nullable: true
        processo:
          type: string
          description: Administrative process number.
          nullable: true
        abertura_proposta:
          type: string
          description: Start of the bid reception, Brasília time.
          nullable: true
        encerramento_proposta:
          type: string
          description: 'End of the bid reception, which is the session opening: the basis of the challenge deadline.'
          nullable: true
        amparo_legal:
          type: string
          description: 'Amparo legal declarado, ex.: `Lei 14.133/2021, Art. 28, I`.'
          nullable: true
        amparo_legal_codigo:
          type: integer
