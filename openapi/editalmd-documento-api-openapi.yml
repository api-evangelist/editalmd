openapi: 3.2.0
info:
  title: EditalMD Documento API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Documento
paths:
  /api/documento/{id}/avaliacao/premium:
    post:
      operationId: post_api_documento_by_id_avaliacao_premium
      summary: Grants one premium document per agent; it generates it if necessary, without…
      description: 'Allowance per credential, until the earlier date between the 30 days of the agent and the end of the pilot. Repeating the same document does not use another unit. Do not send a payment. Premium: keep evaluation.access_code and use X-Editalmd-Avaliacao together with X-Agent-Pass in the readings and in GET /geracao. Basic does not open premium content. Pilot subject to the global budget; no automatic renewal.

        Returns: { documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the collection document.
        example: '9927611'
      - name: X-Agent-Pass
        in: header
        required: true
        schema:
          type: string
        description: Persistent individual credential obtained at POST https://api.editalmd.com/licitacoes/api/agente. It is not the User-Agent.
      responses:
        '200':
          description: '{ documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento solicitado.
                  status:
                    type: string
                    description: ready, pending, running or failed; access_granted recovers the premium grant, without stating a completed processing. A premium preparation can also bring error.
                  error:
                    type: string
                    description: Cause of the failure, when there is one.
                    nullable: true
                  retry_after_s:
                    type: integer
                    description: Interval for the next GET.
                  evaluation:
                    type: object
                    description: kind basic or sponsored_premium. Premium includes a private access_code, access_header and expires_at; zero charge.
                  state_url:
                    type: string
                    description: Follow-up GET of the premium, with the two evaluation headers.
                  result:
                    type: object
                    description: 'Only a ready basic reading: pages [{page,text}], page_count, ocr_page_count, source_sha256, reviewed:false, structured_tables:false and empty_pages.'
                required:
                - documento_id
                - evaluation
        '400':
          description: Unknown fields or query; POST accepts an absent body or {}.
        '401':
          description: Missing or invalid agent credential.
        '402':
          description: Individual quota used or expired; see purchase_url to buy.
        '404':
          description: Document or request of this agent not found.
        '409':
          description: Source or quote unavailable/changed; no charge.
        '422':
          description: Premium up to 50 pages; basic PDF up to 50 pages and 32 MiB.
        '503':
          description: Pilot ended, budget exhausted or queue without capacity; keep the credential and try later.
      tags:
      - Documento
  /api/documento/{id}/avaliacao/basico:
    post:
      operationId: post_api_documento_by_id_avaliacao_basico
      summary: 'Queues an individual basic reading: native text and local OCR, without review'
      description: 'Allowance per credential, until the earlier date between the 30 days of the agent and the end of the pilot. Repeating the same document does not use another unit. Do not send a payment. Premium: keep evaluation.access_code and use X-Editalmd-Avaliacao together with X-Agent-Pass in the readings and in GET /geracao. Basic does not open premium content. Pilot subject to the global budget; no automatic renewal.

        Returns: { documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the collection document.
        example: '9927611'
      - name: X-Agent-Pass
        in: header
        required: true
        schema:
          type: string
        description: Persistent individual credential obtained at POST https://api.editalmd.com/licitacoes/api/agente. It is not the User-Agent.
      responses:
        '200':
          description: '{ documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento solicitado.
                  status:
                    type: string
                    description: ready, pending, running or failed; access_granted recovers the premium grant, without stating a completed processing. A premium preparation can also bring error.
                  error:
                    type: string
                    description: Cause of the failure, when there is one.
                    nullable: true
                  retry_after_s:
                    type: integer
                    description: Interval for the next GET.
                  evaluation:
                    type: object
                    description: kind basic or sponsored_premium. Premium includes a private access_code, access_header and expires_at; zero charge.
                  state_url:
                    type: string
                    description: Follow-up GET of the premium, with the two evaluation headers.
                  result:
                    type: object
                    description: 'Only a ready basic reading: pages [{page,text}], page_count, ocr_page_count, source_sha256, reviewed:false, structured_tables:false and empty_pages.'
                required:
                - documento_id
                - evaluation
        '400':
          description: Unknown fields or query; POST accepts an absent body or {}.
        '401':
          description: Missing or invalid agent credential.
        '402':
          description: Individual quota used or expired; see purchase_url to buy.
        '404':
          description: Document or request of this agent not found.
        '409':
          description: Source or quote unavailable/changed; no charge.
        '422':
          description: Premium up to 50 pages; basic PDF up to 50 pages and 32 MiB.
        '503':
          description: Pilot ended, budget exhausted or queue without capacity; keep the credential and try later.
      tags:
      - Documento
    get:
      operationId: get_api_documento_by_id_avaliacao_basico
      summary: Gets the state and the basic text per page, only for the agent that requested it
      description: 'Allowance per credential, until the earlier date between the 30 days of the agent and the end of the pilot. Repeating the same document does not use another unit. Do not send a payment. Premium: keep evaluation.access_code and use X-Editalmd-Avaliacao together with X-Agent-Pass in the readings and in GET /geracao. Basic does not open premium content. Pilot subject to the global budget; no automatic renewal.

        Returns: { documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the collection document.
        example: '9927611'
      - name: X-Agent-Pass
        in: header
        required: true
        schema:
          type: string
        description: Persistent individual credential obtained at POST https://api.editalmd.com/licitacoes/api/agente. It is not the User-Agent.
      responses:
        '200':
          description: '{ documento_id, status?, error?, retry_after_s?, evaluation, state_url?, result? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento solicitado.
                  status:
                    type: string
                    description: ready, pending, running or failed; access_granted recovers the premium grant, without stating a completed processing. A premium preparation can also bring error.
                  error:
                    type: string
                    description: Cause of the failure, when there is one.
                    nullable: true
                  retry_after_s:
                    type: integer
                    description: Interval for the next GET.
                  evaluation:
                    type: object
                    description: kind basic or sponsored_premium. Premium includes a private access_code, access_header and expires_at; zero charge.
                  state_url:
                    type: string
                    description: Follow-up GET of the premium, with the two evaluation headers.
                  result:
                    type: object
                    description: 'Only a ready basic reading: pages [{page,text}], page_count, ocr_page_count, source_sha256, reviewed:false, structured_tables:false and empty_pages.'
                required:
                - documento_id
                - evaluation
        '400':
          description: Unknown fields or query; POST accepts an absent body or {}.
        '401':
          description: Missing or invalid agent credential.
        '402':
          description: Individual quota used or expired; see purchase_url to buy.
        '404':
          description: Document or request of this agent not found.
        '409':
          description: Source or quote unavailable/changed; no charge.
        '422':
          description: Premium up to 50 pages; basic PDF up to 50 pages and 32 MiB.
        '503':
          description: Pilot ended, budget exhausted or queue without capacity; keep the credential and try later.
      tags:
      - Documento
  /api/documento/{id}/vincular:
    post:
      operationId: post_api_documento_by_id_vincular
      summary: Links your anonymous purchase to the authenticated account, without a new charge
      description: 'Requires a session and private proof of the purchase. It records the global right of the account by the payment receipt: idempotent for the same owner, and another owner cannot claim it. The code keeps opening the document by itself.

        Returns: { vinculado, documento_id }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the purchased document.
        example: '2110258'
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: Private capability received after the payment. The document cookie is also accepted.
      responses:
        '200':
          description: '{ vinculado, documento_id }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vinculado:
                    type: boolean
                    description: The purchase belongs to the account.
                  documento_id:
                    type: integer
                    description: Documento.
                required:
                - vinculado
                - documento_id
        '400':
          description: Invalid body/cursor.
        '401':
          description: 'Session missing, invalid or ended (`session_ended`: sign in again).'
        '403':
          description: Mutation origin or CSRF refused.
        '404':
          description: Purchase not found for this client.
        '405':
          description: Method not allowed.
        '503':
          description: Account or global limit unavailable.
      tags:
      - Documento
  /api/documento/{id}/acesso:
    get:
      operationId: get_api_documento_by_id_acesso
      summary: Checks the link and allows exporting the code of a purchase that is still…
      description: 'Returns: { documento_id, vinculado, recuperacao }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the purchased document.
        example: '2110258'
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: Access code; an equivalent session/cookie is accepted.
      responses:
        '200':
          description: '{ documento_id, vinculado, recuperacao }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento.
                  vinculado:
                    type: boolean
                    description: The current account owns this document.
                  recuperacao:
                    type: string
                    description: Private code that can be exported only while not linked.
                    nullable: true
                required:
                - documento_id
                - vinculado
                - recuperacao
        '400':
          description: Invalid body/cursor.
        '401':
          description: 'Session missing, invalid or ended (`session_ended`: sign in again).'
        '402':
          description: Access not purchased.
        '403':
          description: Mutation origin or CSRF refused.
        '404':
          description: Purchase not found for this client.
        '405':
          description: Method not allowed.
        '503':
          description: Account or global limit unavailable.
      tags:
      - Documento
  /api/documento/{id}/preparo:
    get:
      operationId: get_api_documento_by_id_preparo
      summary: Free lookup of the original file, without requesting work
      description: 'Answers only the state of the file. It does not deliver content, grant access, confirm pages or start a generation. No query. no-store answer.

        Returns: { data }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the document returned by the procurement.
        example: '4806436'
      responses:
        '200':
          description: '{ data }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: document_id identifies the document. status is queued, downloading, downloaded or unavailable. requested shows a priority already requested. retry_after_s is 60 while pending and 0 when it finishes.
                required:
                - data
        '202':
          description: 'Original pending or downloading. Retry-After: 60. Check the channel or the GET after this time.'
        '400':
          description: Invalid ID, query or body. POST accepts an empty body or only {}.
        '404':
          description: Document not found.
        '409':
          description: Original unavailable. No purchase or generation was started.
        '429':
          description: Request limit. Respect Retry-After.
        '502':
          description: Invalid answer from the origin.
        '503':
          description: The original could not be fetched.
      tags:
      - Documento
    post:
      operationId: post_api_documento_by_id_preparo
      summary: Downloads a pending original from PNCP now. Free and idempotent
      description: 'Use it when the person opens the document. Empty body or {} of up to two bytes. A free collector downloads the original immediately and the state becomes downloading; without a free collector, the request goes first in the queue. It does not start OCR, a purchase or a charge. After the arrival, check /geracao to confirm the pages, hash and price before buying.

        Returns: { data }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the document returned by the procurement.
        example: '4806436'
      responses:
        '200':
          description: '{ data }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: document_id identifies the document. status is queued, downloading, downloaded or unavailable. requested shows a priority already requested. retry_after_s is 60 while pending and 0 when it finishes.
                required:
                - data
        '202':
          description: 'Original pending or downloading. Retry-After: 60. Check the channel or the GET after this time.'
        '400':
          description: Invalid ID, query or body. POST accepts an empty body or only {}.
        '403':
          description: Browser request outside the same origin.
        '404':
          description: Document not found.
        '408':
          description: Body read deadline expired.
        '409':
          description: Original unavailable. No purchase or generation was started.
        '413':
          description: Corpo excedeu dois bytes.
        '415':
          description: Compressed body not accepted.
        '429':
          description: Request limit. Respect Retry-After.
        '502':
          description: Invalid answer from the origin.
        '503':
          description: The original could not be fetched.
      tags:
      - Documento
  /api/documento/{id}/preparo/canal:
    get:
      operationId: get_api_documento_by_id_preparo_canal
      summary: 'WebSocket of the state of the original. HTTP twin: GET /preparo'
      description: 'Use wss on the same domain and the exact Origin. The channel only sends the same JSON as the GET; it receives no commands. One lookup per document serves all the tabs: every 5 seconds during the download and every minute in the queue. Caps per process: 32 documents, 128 connections and four per network. Maximum duration of 15 minutes. It closes when it finishes or has no connections. When you come back to the tab, check the GET and reconnect. No content or private token is sent.

        Returns: WebSocket: JSON messages with the same data as GET /preparo.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the document returned by the procurement.
        example: '4806436'
      responses:
        '200':
          description: 'WebSocket: JSON messages with the same data as GET /preparo.'
        '400':
          description: Invalid ID or query.
        '403':
          description: Origin different from the channel domain.
        '404':
          description: Document not found. The server refuses before opening the channel.
        '426':
          description: Upgrade to WebSocket required.
        '429':
          description: 'Connection limit. Retry-After: 60.'
        '503':
          description: Channel unavailable.
      tags:
      - Documento
  /api/documento/{id}:
    get:
      operationId: get_api_documento_by_id
      summary: Title, type, pages and procurement linked to the document.
      description: 'Returns: { documento, compra_id }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document identifier.
        example: '93998'
      responses:
        '200':
          description: '{ documento, compra_id }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento:
                    type: object
                    description: id, titulo, tipo, paginas (null when unknown), tem_texto, tem_binario, disponivel and gratuito. It does not include text, files or internal paths.
                  compra_id:
                    type: integer
                    description: Linked procurement. Check /api/compra/:id to list its documents with titles, types and pages (up to 50 per record).
                    nullable: true
                required:
                - documento
                - compra_id
        '400':
          description: Invalid ID.
        '404':
          description: Document not found.
        '502':
          description: Origin unavailable.
      tags:
      - Documento
  /api/documento/{id}/markdown:
    get:
      operationId: get_api_documento_by_id_markdown
      summary: Markdown with provenance and hash, with purchased access or sponsored premium.
      description: 'Returns: `text/markdown`. Headers: `x-editalmd-regime`, `x-editalmd-sha256`. Reading does not generate a receipt or a charge.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document identifier, from the procurement record.
        example: '123'
      - name: X-Agent-Pass
        in: header
        required: false
        schema:
          type: string
        description: Individual agent credential, required together with X-Editalmd-Avaliacao.
      - name: X-Editalmd-Avaliacao
        in: header
        required: false
        schema:
          type: string
        description: evaluation.access_code of the sponsored premium, only for this document and agent, with an expiry. Use it together with X-Agent-Pass; it is not a receipt or a purchase.
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: 'Private code in acesso.codigo after a payment by someone not signed in to the account; up to 4096 characters. It authorizes this document for whoever holds it. A purchase made with the account session issues no code: the global right of the account (HttpOnly cookie) applies, and the right of the edm_… guest applies with its token. A public receipt does not grant access.'
      responses:
        '200':
          description: '`text/markdown`. Headers: `x-editalmd-regime`, `x-editalmd-sha256`. Reading does not generate a receipt or a charge.'
        '202':
          description: 'Text in preparation in the collection (`extracao_em_andamento`): `retry_after_s` in the body and `Retry-After` in the header. Repeat after this time. The preparation is not a completed delivery yet.'
        '402':
          description: Without valid purchased or sponsored access. Use the individual evaluation, buy through POST /api/documento/:id/geracao or a deposit; five examples are free.
        '404':
          description: Purchase not found for the authenticated account, or a missing document/resource.
        '409':
          description: Text unavailable or generation required. Use geracao_url to check the pages and the total and to authorize the payment.
        '502':
          description: Origin unavailable; no charge on reading.
      tags:
      - Documento
  /api/documento/{id}/habilitacao:
    post:
      operationId: post_api_documento_by_id_habilitacao
      summary: Qualification list with literal excerpts.
      description: 'Conditions, exceptions and evidence per page from the available analysis. The lookup does not start another analysis. Deadlines, proposals and other obligations are in the dossier; this list covers the qualification and the required certificates of performance, without stating what the company has.

        Returns: { documento_id, compra_id, sha256_texto, dossie_versao, modelo, cache, recibo, recibo_url, aviso, habilitacao{juridica,fiscal_social_trabalhista,economico_financeira,tecnica,exclusivo_me_epp,impugnacao_texto,proposta_texto,total,descartados} }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document identifier, from the procurement record.
        example: '123'
      - name: X-Agent-Pass
        in: header
        required: false
        schema:
          type: string
        description: Individual agent credential, required together with X-Editalmd-Avaliacao.
      - name: X-Editalmd-Avaliacao
        in: header
        required: false
        schema:
          type: string
        description: evaluation.access_code of the sponsored premium, only for this document and agent, with an expiry. Use it together with X-Agent-Pass; it is not a receipt or a purchase.
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: 'Private code in acesso.codigo after a payment by someone not signed in to the account; up to 4096 characters. It authorizes this document for whoever holds it. A purchase made with the account session issues no code: the global right of the account (HttpOnly cookie) applies, and the right of the edm_… guest applies with its token. A public receipt does not grant access.'
      responses:
        '200':
          description: '{ documento_id, compra_id, sha256_texto, dossie_versao, modelo, cache, recibo, recibo_url, aviso, habilitacao{juridica,fiscal_social_trabalhista,economico_financeira,tecnica,exclusivo_me_epp,impugnacao_texto,proposta_texto,total,descartados} }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habilitacao'
        '402':
          description: Without valid purchased or sponsored access. Use the individual evaluation, buy through POST /api/documento/:id/geracao or a deposit; five examples are free.
        '404':
          description: Purchase not found for the authenticated account, or a missing document/resource.
        '409':
          description: Dossier still in preparation. This lookup starts no new analysis.
        '502':
          description: Invalid dossier or incomplete answer from the origin.
        '503':
          description: Dossier temporarily unavailable.
      tags:
      - Documento
  /api/documento/{id}/geracao:
    get:
      operationId: get_api_documento_by_id_geracao
      summary: State, quote and access right; free lookup, without starting processing
      description: 'Returns: { documento_id, status?, error?, retry_after_s?, processing?, markdown_url, geracao_url, acesso_comprado, acesso?, preco_pagina_usd, cotacao, pagamento? }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the document returned by the procurement.
        example: '2110000'
      - name: X-Agent-Pass
        in: header
        required: false
        schema:
          type: string
        description: Individual agent credential, required together with X-Editalmd-Avaliacao.
      - name: X-Editalmd-Avaliacao
        in: header
        required: false
        schema:
          type: string
        description: evaluation.access_code of the sponsored premium, only for this document and agent, with an expiry. Use it together with X-Agent-Pass; it is not a receipt or a purchase.
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: 'Private code in acesso.codigo after a payment by someone not signed in to the account; up to 4096 characters. It authorizes this document for whoever holds it. A purchase made with the account session issues no code: the global right of the account (HttpOnly cookie) applies, and the right of the edm_… guest applies with its token. A public receipt does not grant access.'
      responses:
        '200':
          description: '{ documento_id, status?, error?, retry_after_s?, processing?, markdown_url, geracao_url, acesso_comprado, acesso?, preco_pagina_usd, cotacao, pagamento? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento solicitado.
                  status:
                    type: string
                    description: '`pronto` when the reading can be opened.'
                  error:
                    type: string
                    description: '`geracao_necessaria`, `extracao_em_andamento`, `geracao_falhou` or the cause of the unavailability.'
                  retry_after_s:
                    type: integer
                    description: Minimum interval until the next follow-up GET.
                  processing:
                    type: object
                    description: 'Progresso real: `progress.stage` (preparing, reading, verifying, packaging), `pages_total`, `pages_processed`, `pages_completed`, `pass`; `updated_at` e `elapsed_ms`.'
                  markdown_url:
                    type: string
                    description: GET of the Markdown, with the purchased access.
                  geracao_url:
                    type: string
                    description: GET for the state/quote; POST to buy individual access.
                  acesso_comprado:
                    type: object
                    description: This credential can read the document, regardless of the global state of the text.
                  acesso:
                    type: object
                    description: 'After a payment confirmed outside the account session: a private codigo and the X-Editalmd-Acesso header. Keep it to reopen or to link to an account (POST /vincular). Do not publish it; it does not open another document.'
                  preco_pagina_usd:
                    type: string
                    description: US$ 0.02 per page on the site and the API (x402 or credit).
                  cotacao:
                    type: object
                    description: 'Pages confirmed in the document: paginas, source_sha256, preco_pagina_usd and preco_total_usd, and the same in reais at the fixed exchange rate of the house Pix (preco_pagina_brl, preco_total_brl), with the smallest credit package in reais (pacote_minimo_brl) and how many documents like this one it covers (documentos_no_pacote). Null when a quote is not possible. The purchase checks only paginas, source_sha256 and preco_total_usd.'
                    nullable: true
                  pagamento:
                    type: object
                    description: 'When charged: the `recibo` of the x402/credit door and `preco_usd`. Keep it even if the origin fails.'
                required:
                - documento_id
                - markdown_url
                - geracao_url
                - acesso_comprado
                - preco_pagina_usd
                - cotacao
        '202':
          description: Processing in progress; follow up through GET, respecting Retry-After. Never repeat the POST to poll.
        '404':
          description: Documento inexistente.
        '409':
          description: Generation required, a previous failure or binary unavailable; check `error`.
        '502':
          description: Origin unavailable; do not repeat the payment without checking the state and the receipt.
      tags:
      - Documento
    post:
      operationId: post_api_documento_by_id_geracao
      summary: Buys individual access to the document for US$ 0.02/page, through x402/credit
      description: 'Each buyer pays, even when the text is ready. Check GET or the 402, confirm pages/hash/total and send cotacao. The account session (cookie + browser CSRF) records the purchase in the global right of the account before the delivery, without a separate code; with the edm_… guest (Bearer), the right is the guest''s and the code comes along; an agent uses X-Credito. Without an account, keep acesso.codigo to reopen or to link later. After the link, only the account opens it. A ready text reuses the OCR; a necessary generation is included. An unknown/changed quote does not charge. 152 pages = US$ 3.04. Body up to 4096 bytes. After a 202, follow up through GET. Paid and the recording of the right failed: 502 `pago_nao_registrado` with the `recibo`; keep it, and support delivers or refunds.

        Returns: { documento_id, status?, error?, retry_after_s?, processing?, markdown_url, geracao_url, acesso_comprado, acesso?, preco_pagina_usd, cotacao, pagamento? }'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Positive ID of the document returned by the procurement.
        example: '2110000'
      - name: X-Agent-Pass
        in: header
        required: false
        schema:
          type: string
        description: Individual agent credential, required together with X-Editalmd-Avaliacao.
      - name: X-Editalmd-Avaliacao
        in: header
        required: false
        schema:
          type: string
        description: evaluation.access_code of the sponsored premium, only for this document and agent, with an expiry. Use it together with X-Agent-Pass; it is not a receipt or a purchase.
      - name: X-Editalmd-Acesso
        in: header
        required: false
        schema:
          type: string
        description: 'Private code in acesso.codigo after a payment by someone not signed in to the account; up to 4096 characters. It authorizes this document for whoever holds it. A purchase made with the account session issues no code: the global right of the account (HttpOnly cookie) applies, and the right of the edm_… guest applies with its token. A public receipt does not grant access.'
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
        description: x402 authorization of the 402 challenge.
      - name: X-Credito
        in: header
        required: false
        schema:
          type: string
        description: cred_… token to deduct from the balance, as an alternative to x402.
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer cred_… is an alternative to X-Credito. The account travels in a cookie, never as a bearer.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Attempt key, up to 80 characters; keep it in credit retries of the same document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cotacao:
                  type: object
                  description: 'Object received in the GET/402: paginas, source_sha256 and preco_total_usd must match the current quote. Required when you send a payment authorization.'
      responses:
        '200':
          description: '{ documento_id, status?, error?, retry_after_s?, processing?, markdown_url, geracao_url, acesso_comprado, acesso?, preco_pagina_usd, cotacao, pagamento? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documento_id:
                    type: integer
                    description: Documento solicitado.
                  status:
                    type: string
                    description: '`pronto` when the reading can be opened.'
                  error:
                    type: string
                    description: '`geracao_necessaria`, `extracao_em_andamento`, `geracao_falhou` or the cause of the unavailability.'
                  retry_after_s:
                    type: integer
                    description: Minimum interval until the next follow-up GET.
                  processing:
                    type: object
                    description: 'Progresso real: `progress.stage` (preparing, reading, verifying, packaging), `pages_total`, `pages_processed`, `pages_completed`, `pass`; `updated_at` e `elapsed_ms`.'
                  markdown_url:
                    type: string
                    description: GET of the Markdown, with the purchased access.
                  geracao_url:
                    type: string
                    description: GET for the state/quote; POST to buy individual access.
                  acesso_comprado:
                    type: object
                    description: This credential can read the document, regardless of the global state of the text.
                  acesso:
                    type: object
                    description: 'After a payment confirmed outside the account session: a private codigo and the X-Editalmd-Acesso header. Keep it to reopen or to link to an account (POST /vincular). Do not publish it; it does not open another document.'
                  preco_pagina_usd:
                    type: string
                    description: US$ 0.02 per page on the site and the API (x402 or credit).
                  cotacao:
                    type: object
                    description: 'Pages confirmed in the document: paginas, source_sha256, preco_pagina_usd and preco_total_usd, and the same in reais at the fixed exchange rate of the house Pix (preco_pagina_brl, preco_total_brl), with the smallest credit package in reais (pacote_minimo_brl) and how many documents like this one it covers (documentos_no_pacote). Null when a quote is not possible. The purchase checks only paginas, source_sha256 and preco_total_usd.'
                    nullable: true
                  pagamento:
                    type: object
                    description: 'When charged: the `recibo` of the x402/credit door and `preco_usd`. Keep it even if the origin fails.'
                required:
                - documento_id
                - markdown_url
                - geracao_url
                - acesso_comprado
                - preco_pagina_usd
                - cotacao
        '202':
          description: Processing in progress; follow up through GET, respecting Retry-After. Never repeat the POST to poll.
        '400':
          description: Malformed body or unknown fields.
        '401':
          description: 'Invalid credit, or `session_ended` (expired session cookie: sign in again); nothing charged.'
        '402':
          description: Payment required or refused; it announces x402, credit and the quote.
        '403':
          description: '`invalid_origin` / `invalid_csrf`: a purchase with the account cookie requires the same origin and X-CSRF-Token; nothing charged.'
        '404':
          description: Documento inexistente.
        '409':
          description: Changed/missing quote, unknown pages or generation unavailable; nothing charged before the authorization.
        '413':
          description: Corpo excedeu 4096 bytes.
        '502':
          description: 'Origin unavailable; do not repeat the payment without checking the state and the receipt. `pago_nao_registrado`: paid and the recording of the right failed; keep the `recibo`.'
        '503':
          description: Payment without configuration, `conta_indisponivel` or `acesso_exige_pagamento` (a document never comes out free); nothing charged.
      tags:
      - Documento
