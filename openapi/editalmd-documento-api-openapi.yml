components:
  schemas:
    Habilitacao:
      type: object
      properties:
        documento_id:
          type: integer
          description: Documento lido.
        compra_id:
          type: integer
          description: Procurement of the document.
          nullable: true
        sha256_texto:
          type: string
          description: Hash of the source text of the dossier.
        dossie_versao:
          type: string
          description: Hash of the identity of the shared analysis.
        modelo:
          type: string
          description: Model that extracted it.
          nullable: true
        cache:
          type: boolean
          description: 'False: it reads the current available version.'
        recibo:
          type: string
          description: Receipt of the paid delivery; null in the cache.
          nullable: true
        recibo_url:
          type: string
          description: Where to check the receipt.
          nullable: true
        aviso:
          type: string
          description: Reminder to check in the tender document.
        habilitacao:
          allOf:
          - $ref: '#/components/schemas/ListaHabilitacao'
          description: The requirements per family and what the tender document says about deadlines.
      required:
      - documento_id
      - compra_id
      - sha256_texto
      - dossie_versao
      - modelo
      - cache
      - recibo
      - recibo_url
      - aviso
      - habilitacao
      description: The qualification list extracted from a tender document, per family, with provenance.
    Exigencia:
      type: object
      properties:
        exigencia:
          type: string
          description: Short description, e.g. `Certidão negativa de débitos trabalhistas (CNDT)`.
        trecho:
          type: string
          description: Literal excerpt checked in the Markdown, up to 4000 characters.
        pagina:
          type: integer
          description: Physical page of the first evidence.
        fato_id:
          type: integer
          description: Identity of the fact in the versioned dossier.
        condicao:
          type: string
          description: When it applies.
          nullable: true
        excecoes:
          type: string
          description: Caveats of the source.
          nullable: true
        evidencias:
          type: array
          items:
            type: object
          description: All the excerpts with page and UTF-16 offsets.
      required:
      - exigencia
      - trecho
      - pagina
      - fato_id
      - condicao
      - excecoes
      - evidencias
      description: A qualification document or requirement and the line of the tender document that requires it.
    ListaHabilitacao:
      type: object
      properties:
        juridica:
          type: array
          items:
            $ref: '#/components/schemas/Exigencia'
          description: 'Legal qualification: articles of incorporation, registration, power of attorney…'
        fiscal_social_trabalhista:
          type: array
          items:
            $ref: '#/components/schemas/Exigencia'
          description: 'Regularidade fiscal, social e trabalhista: CND federal, FGTS, CNDT…'
        economico_financeira:
          type: array
          items:
            $ref: '#/components/schemas/Exigencia'
          description: 'Economic and financial qualification: balance sheet, bankruptcy certificate, ratios.'
        tecnica:
          type: array
          items:
            $ref: '#/components/schemas/Exigencia'
          description: 'Technical qualification: certificates of performance, professional council registration, team.'
        exclusivo_me_epp:
          type: boolean
          description: 'Null: participation conditioned by item/lot is in the facts of the dossier.'
          nullable: true
        impugnacao_texto:
          type: string
          description: 'Null in this projection: check the deadlines and conditions in the dossier.'
          nullable: true
        proposta_texto:
          type: string
          description: 'Null in this projection: check the deadlines and conditions in the dossier.'
          nullable: true
        total:
          type: integer
          description: Accepted requirements, adding up the four families.
        descartados:
          type: integer
          description: Zero in this projection; the validation happens during the preparation of the dossier.
      required:
      - juridica
      - fiscal_social_trabalhista
      - economico_financeira
      - tecnica
      - exclusivo_me_epp
      - impugnacao_texto
      - proposta_texto
      - total
      - descartados
      description: Qualification requirements per family, plus the markings that the tender document has in text.
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
