openapi: 3.2.0
info:
  title: EditalMD Exemplos API
  version: 1d751aaf
servers:
- url: https://editalmd.com
tags:
- name: Exemplos
paths:
  /exemplos:
    get:
      operationId: get_exemplos
      summary: 'Gallery of five real documents already processed: free reading, original…'
      description: 'Returns: HTML with ready examples. Opening or downloading does not generate processing or a charge.'
      responses:
        '200':
          description: HTML with ready examples. Opening or downloading does not generate processing or a charge.
      tags:
      - Exemplos
  /api/exemplos:
    get:
      operationId: get_api_exemplos
      summary: Five ready examples, with provenance, pages, images, SHA-256 and reading and…
      description: 'Returns: { exemplos }'
      responses:
        '200':
          description: '{ exemplos }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  exemplos:
                    type: array
                    items:
                      type: object
                    description: documento_id, compra_id, titulo, local, descricao, paginas, imagens, sha256, gratuito=true, leitura_url, markdown_url, manifesto_url, original_url, arquivos_url e pacote_url.
                required:
                - exemplos
      tags:
      - Exemplos
components:
  securitySchemes:
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - public-procurement
  - documents
  - data
  docs:
    homepage: https://editalmd.com/
    apiReference: https://editalmd.com/developers
    llms: https://editalmd.com/llms.txt
